server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        # Re-resolve the backend on every request instead of once at startup.
        #
        # `proxy_pass http://backend:8000` resolves that name when nginx loads
        # and caches the address for the life of the process. Recreating the
        # backend container - any rebuild does - gives it a new address on the
        # Docker network, and this gateway went on dialling the old one until
        # somebody reloaded it by hand. Every API call answered 502 with a
        # perfectly healthy backend running behind it, which reads as the site
        # being down rather than as a stale address.
        #
        # 127.0.0.11 is Docker's embedded DNS. Naming the upstream through a
        # variable is what forces the lookup per request; the URI has to be
        # appended explicitly because nginx no longer knows the target at
        # config time.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $anios_backend backend;
        proxy_pass http://$anios_backend:8000$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        add_header X-Accel-Buffering no always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}

