<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The tab icon. Deliberately not the header mark: at 16px the concentric folds
    inside each lobe merge into a blur, so this keeps the scalloped silhouette
    and the seam and drops everything else. Simpler is what survives tiny.

    The gradient tile carries the brand at sizes where the brain cannot.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="55%" stop-color="#5856d6"/>
      <stop offset="100%" stop-color="#af52de"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <g transform="translate(4 4) scale(1)" fill="none" stroke="#fff" stroke-width="1.7"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.9C10.6 3.1 8.7 3.4 7.9 4.8C6.2 4.7 4.8 6.1 5.1 7.8C3.6 8.6 3.3 10.7 4.6 11.9C3.6 13.2 4.1 15.2 5.6 16C5.7 17.8 7.4 19.1 9.2 18.8C10 19.9 11 20.3 12 20.1"/>
    <path d="M12 3.9C13.4 3.1 15.3 3.4 16.1 4.8C17.8 4.7 19.2 6.1 18.9 7.8C20.4 8.6 20.7 10.7 19.4 11.9C20.4 13.2 19.9 15.2 18.4 16C18.3 17.8 16.6 19.1 14.8 18.8C14 19.9 13 20.3 12 20.1"/>
    <path d="M12 3.9V20.1"/>
  </g>
</svg>
