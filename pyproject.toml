[project]
name = "anios"
version = "0.1.0"
description = "AniOS - A local-first Personal AI Operating System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.30.0",
    "pgvector>=0.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.1.0",
    "langgraph>=1.2.9,<2",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "Pillow>=11.0.0",
    "resvg-py>=0.2",
    "python-multipart>=0.0.20",
    "numpy>=2.0.0",
    # backend/market: browser-impersonating fetch and the parquet store.
    "curl_cffi>=0.10.0",
    "pyarrow>=17.0.0",
    "onnxruntime>=1.20.0",
    "tokenizers>=0.20.0,<1.0.0",
    # See requirements.txt: 2.0 removes mcp.server.fastmcp.
    "mcp>=1.0.0,<2.0.0",
    "jsonschema>=4.20,<5",
    "cryptography>=42.0.0",
    "argon2-cffi>=23.1.0",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-instrumentation-fastapi==0.63b1",
    "opentelemetry-instrumentation-httpx==0.63b1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "google-adk==2.5.0",
]

[project.optional-dependencies]
research = [
    # Training the market ranker; not part of the backend image.
    "torch>=2.5.0",
]
dev = [
    "black>=24.0.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
# `functional` was used without being registered, so every functional run
# printed PytestUnknownMarkWarning and the marker could not be selected on.
markers = [
    "functional: exercises a real prompt against the real runtime, not a stub",
]
# strict, not auto. 114 test files already carry an explicit pytest.mark.asyncio;
# "auto" would change collection semantics for all of them at once, and this
# block exists to register a marker, not to alter 2019 tests.
asyncio_mode = "strict"

[tool.setuptools.packages.find]
# The repo root is a flat layout holding data/, docker/, frontend/, and
# migrations/ alongside the package. Without this, setuptools auto-discovery
# finds multiple top-level packages and refuses to build, breaking
# `pip install -e ".[dev]"`.
include = ["backend*"]

[tool.ruff.lint.per-file-ignores]
# An HTML/CSS template string cannot wrap at 88 characters without changing
# the page it renders; the generator is line-length-exempt, nothing else is.
"scripts/build_eval_page.py" = ["E501"]

[tool.ruff]
line-length = 88
target-version = "py312"
lint.select = ["E", "F", "I", "B", "UP", "PT", "SIM", "N", "C90"]
lint.ignore = []

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["backend"]
exclude = ["^backend/tests/"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
