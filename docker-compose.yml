services:
  vllm-main:
    image: vllm/vllm-openai@sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f
    container_name: anios_vllm_main
    ipc: host
    environment:
      # Exposes /sleep, /wake_up, and /is_sleeping, which the GPU handoff uses
      # to lend the card to ComfyUI for the length of one image job.
      - VLLM_SERVER_DEV_MODE=1
    command:
      # Pre-quantized FP8 (compressed-tensors), not `--quantization fp8`. Both
      # produce FP8 weights on Blackwell's native tensor cores, but the
      # on-the-fly quantizer cannot be woken from sleep. This checkpoint keeps
      # the vision tower, so it still serves the vision role.
      - RedHatAI/Qwen3.5-4B-FP8-dynamic
      - --revision
      - 397b7ba47a99b3221ebfc0cfc5a279118cb733ad
      - --served-model-name
      - qwen/qwen3.5-4b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${VLLM_MAIN_MAX_MODEL_LEN:-16384}
      - --max-num-seqs
      - ${VLLM_MAIN_MAX_NUM_SEQS:-4}
      - --max-num-batched-tokens
      - ${VLLM_MAIN_MAX_BATCHED_TOKENS:-4096}
      # Claim the card generously: sleep mode gives all of this back to ComfyUI
      # for the duration of an image job, so a large resident share costs
      # nothing. This is a fraction of total VRAM, so vLLM must start before
      # ComfyUI or it cannot reach its share; scripts/start-anios.sh does that.
      - --gpu-memory-utilization
      - ${VLLM_MAIN_GPU_MEMORY_UTILIZATION:-0.70}
      # KV cache dtype stays at the default. An FP8 KV cache holds more tokens
      # per GiB, but it is the one setting that breaks waking from sleep on
      # vLLM 0.23.0 (`'list' object has no attribute 'zero_'`), which strands the
      # engine asleep. FP8 *weights* wake correctly; the FP8 KV cache does not.
      # Trading it back still leaves 93,992 cached tokens.
      - --kv-cache-dtype
      - ${VLLM_MAIN_KV_CACHE_DTYPE:-auto}
      # Let AniOS hand the GPU to ComfyUI instead of both runtimes thrashing.
      - --enable-sleep-mode
      # Preserve the qualified latency-first V1 scheduler behavior explicitly
      # instead of relying on version-dependent defaults.
      - --enable-chunked-prefill
      - --async-scheduling
      # AniOS repeats a stable system/tool prefix across turns. Reusing those
      # KV blocks reduces repeated prefill without changing model output.
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
    ports:
      - "8003:8000"
    volumes:
      - ${VLLM_MODEL_CACHE_PATH:-E:/AI/huggingface-cache-vllm}:/root/.cache/huggingface
      - ${VLLM_COMPILE_CACHE_PATH:-E:/AI/vllm-compile-cache}:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 10s
      timeout: 6s
      retries: 60
      start_period: 10m
    restart: unless-stopped

  vllm-embedding:
    image: vllm/vllm-openai@sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f
    container_name: anios_vllm_embedding
    ipc: host
    command:
      - nomic-ai/nomic-embed-text-v1.5
      - --revision
      - e9b6763023c676ca8431644204f50c2b100d9aab
      - --code-revision
      - 7710840340a098cfb869c4f65e87cf2b1b70caca
      - --served-model-name
      - text-embedding-nomic-embed-text-v1.5
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --runner
      - pooling
      - --convert
      - embed
      - --trust-remote-code
      - --max-model-len
      - ${VLLM_EMBEDDING_MAX_MODEL_LEN:-2048}
      - --max-num-seqs
      - ${VLLM_EMBEDDING_MAX_NUM_SEQS:-16}
      # Nomic's weights load in ~0.26 GiB; 0.15 reserved ~2.4 GiB that nothing
      # used. Size this to the measured footprint plus pooling headroom.
      - --gpu-memory-utilization
      - ${VLLM_EMBEDDING_GPU_MEMORY_UTILIZATION:-0.06}
    ports:
      - "8004:8000"
    volumes:
      - ${VLLM_MODEL_CACHE_PATH:-E:/AI/huggingface-cache-vllm}:/root/.cache/huggingface
      - ${VLLM_COMPILE_CACHE_PATH:-E:/AI/vllm-compile-cache}:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 3m
    depends_on:
      vllm-main:
        condition: service_healthy
    restart: unless-stopped

  db:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    container_name: anios_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-anios_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-anios_db}"
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    image: redis:7-alpine
    container_name: anios_redis
    ports:
      - "6379:6379"

  local-capabilities:
    # The one service that was missing this. After a host reboot every sibling
    # came back and this did not, so the MCP capabilities server was simply
    # absent and tool calls had nothing to reach.
    restart: unless-stopped
    build: .
    container_name: anios_local_capabilities
    command:
      - python
      - -m
      - backend.capabilities.visual_mcp
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      - LLM_BASE_URL=http://vllm-main:8000
      - LLM_MODEL=qwen/qwen3.5-4b
      - INFERENCE_ADAPTER=${INFERENCE_ADAPTER:-openai_compatible}
      - INFERENCE_PROVIDER_NAME=vllm
      - MAIN_INFERENCE_ADAPTER=${MAIN_INFERENCE_ADAPTER:-}
      - MAIN_LLM_BASE_URL=http://vllm-main:8000
      - MAIN_LLM_MODEL=qwen/qwen3.5-4b
      # Empty rather than DeepSeek's date: a wrong cutoff is worse than
      # none, because the model would trust everything before it.
      - MAIN_LLM_TRAINING_CUTOFF=${QWEN_TRAINING_CUTOFF:-}
      - MAIN_LLM_REASONING_EFFORT=${MAIN_LLM_REASONING_EFFORT:-none}
      - PRESENTATION_INFERENCE_ADAPTER=${PRESENTATION_INFERENCE_ADAPTER:-}
      - PRESENTATION_LLM_BASE_URL=http://vllm-main:8000
      - PRESENTATION_LLM_MODEL=qwen/qwen3.5-4b
      - PRESENTATION_LLM_REASONING_EFFORT=${PRESENTATION_LLM_REASONING_EFFORT:-none}
      - DIAGRAM_INFERENCE_ADAPTER=${DIAGRAM_INFERENCE_ADAPTER:-}
      - DIAGRAM_LLM_BASE_URL=http://vllm-main:8000
      - DIAGRAM_LLM_MODEL=qwen/qwen3.5-4b
      - DIAGRAM_LLM_REASONING_EFFORT=${DIAGRAM_LLM_REASONING_EFFORT:-none}
      - VISION_INFERENCE_ADAPTER=${VISION_INFERENCE_ADAPTER:-}
      - VISION_LLM_BASE_URL=http://vllm-main:8000
      - VISION_MODEL=qwen/qwen3.5-4b
      - VISION_LLM_REASONING_EFFORT=${VISION_LLM_REASONING_EFFORT:-none}
      # Not previously passed at all, so the one number that decides whether
      # an upload's structured inspection fits could not be changed without
      # a rebuild.
      - VISION_MAX_TOKENS=${VISION_MAX_TOKENS:-1536}
      - VISION_ESCALATION_LLM_BASE_URL=${VISION_ESCALATION_LLM_BASE_URL:-}
      - VISION_ESCALATION_MODEL=${VISION_ESCALATION_MODEL:-}
      - VISION_ESCALATION_LLM_REASONING_EFFORT=${VISION_ESCALATION_LLM_REASONING_EFFORT:-none}
      - EMBEDDING_INFERENCE_ADAPTER=${EMBEDDING_INFERENCE_ADAPTER:-}
      - EMBEDDING_BASE_URL=http://vllm-embedding:8000
      - EMBEDDING_MODEL=text-embedding-nomic-embed-text-v1.5
      - IMAGE_PROVIDER_BASE_URL=http://host.docker.internal:8188
      # One FLUX.2 Klein checkpoint serves generation and editing alike, so
      # the model, text encoder and VAE are shared rather than per-role.
      - IMAGE_MODEL=${IMAGE_MODEL:-flux-2-klein-4b-fp8.safetensors}
      - IMAGE_TEXT_ENCODER=${IMAGE_TEXT_ENCODER:-qwen_3_4b.safetensors}
      - IMAGE_VAE=${IMAGE_VAE:-flux2-vae.safetensors}
      # The distilled model is a four-step sampler in both directions.
      - IMAGE_GENERATION_STEPS=${IMAGE_GENERATION_STEPS:-4}
      - IMAGE_EDIT_STEPS=${IMAGE_EDIT_STEPS:-4}
      # How much of the source survives into the edit, and how it is
      # resampled. Both were ComfyUI template defaults; `nearest-exact`
      # stipples any photograph, and the megapixel budget is the ceiling
      # on what comes back, because the output is generated at that size.
      - IMAGE_EDIT_MEGAPIXELS=${IMAGE_EDIT_MEGAPIXELS:-2.0}
      - IMAGE_EDIT_SCALE_METHOD=${IMAGE_EDIT_SCALE_METHOD:-lanczos}
      - IMAGE_EDIT_MODEL=${IMAGE_EDIT_MODEL:-}
      - IMAGE_EDIT_CLIP=${IMAGE_EDIT_CLIP:-clip_l.safetensors}
      - IMAGE_EDIT_T5=${IMAGE_EDIT_T5:-t5xxl_fp8_e4m3fn_scaled.safetensors}
      - IMAGE_EDIT_VAE=${IMAGE_EDIT_VAE:-ae.safetensors}
      - IMAGE_EDIT_KONTEXT_STEPS=${IMAGE_EDIT_KONTEXT_STEPS:-20}
      - IMAGE_EDIT_GUIDANCE=${IMAGE_EDIT_GUIDANCE:-2.5}
      - ARTIFACT_STORAGE_ROOT=/app/data/artifacts
      - PRESENTATION_RENDERER_BASE_URL=http://presentation-renderer:8002
      - PRESENTATION_REQUIRE_OFFICE_VALIDATION=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - artifactdata:/app/data/artifacts
    depends_on:
      vllm-main:
        condition: service_healthy
      vllm-embedding:
        condition: service_healthy
      db:
        condition: service_healthy
      presentation-renderer:
        condition: service_healthy

  presentation-renderer:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build:
      context: ./presentation-renderer
    container_name: anios_presentation_renderer
    environment:
      - PORT=8002
      - MAX_REQUEST_BYTES=62914560
      - REQUIRE_OFFICE_VALIDATION=true
    ports:
      - "8002:8002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10

  presentation-worker:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build: .
    container_name: anios_presentation_worker
    command:
      - python
      - -m
      - backend.workers.presentation_worker
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      # Seals free-text columns at rest. Empty disables it; every service
      # that writes a sealed column needs the same key, or one of them
      # stores plaintext into a column another reads as sealed.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - LLM_BASE_URL=http://vllm-main:8000
      - LLM_MODEL=qwen/qwen3.5-4b
      - INFERENCE_ADAPTER=${INFERENCE_ADAPTER:-openai_compatible}
      - INFERENCE_PROVIDER_NAME=vllm
      - PRESENTATION_INFERENCE_ADAPTER=${PRESENTATION_INFERENCE_ADAPTER:-}
      - PRESENTATION_LLM_BASE_URL=http://vllm-main:8000
      - PRESENTATION_LLM_MODEL=qwen/qwen3.5-4b
      - PRESENTATION_LLM_REASONING_EFFORT=${PRESENTATION_LLM_REASONING_EFFORT:-none}
      - IMAGE_PROVIDER_BASE_URL=http://host.docker.internal:8188
      # This worker creates slide imagery through the same provider the chat
      # path uses, so it needs the same checkpoint. Without these it silently
      # fell back to the built-in defaults, and changing IMAGE_MODEL would have
      # moved chat images to a new model while leaving slides on the old one.
      - IMAGE_MODEL=${IMAGE_MODEL:-flux-2-klein-4b-fp8.safetensors}
      - IMAGE_TEXT_ENCODER=${IMAGE_TEXT_ENCODER:-qwen_3_4b.safetensors}
      - IMAGE_VAE=${IMAGE_VAE:-flux2-vae.safetensors}
      - IMAGE_GENERATION_STEPS=${IMAGE_GENERATION_STEPS:-4}
      - PRESENTATION_AUTO_IMAGE_MAX=${PRESENTATION_AUTO_IMAGE_MAX:-1}
      - PRESENTATION_AUTO_IMAGE_SIZE=${PRESENTATION_AUTO_IMAGE_SIZE:-1024}
      - ARTIFACT_STORAGE_ROOT=/app/data/artifacts
      - PRESENTATION_RENDERER_BASE_URL=http://presentation-renderer:8002
      - PRESENTATION_REQUIRE_OFFICE_VALIDATION=true
      # Deck grounding runs in this process, not the API, because the durable
      # worker is what plans a deck. Without these the worker's search provider
      # is silently disabled and every figure comes from recollection again.
      - PRESENTATION_RESEARCH_ENABLED=${PRESENTATION_RESEARCH_ENABLED:-true}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - SEARCH_MONTHLY_CREDITS=${SEARCH_MONTHLY_CREDITS:-1000}
      - SEARCH_PROVIDER_NAME=${SEARCH_PROVIDER_NAME:-tavily}
      - SEARCH_MCP_SERVER_ID=${SEARCH_MCP_SERVER_ID:-internet}
      - SEARCH_MCP_TOOL_NAME=${SEARCH_MCP_TOOL_NAME:-search_web}
      # Declared so they reach the internet MCP subprocess too, which
      # inherits SEARCH_* from this environment and does the actual
      # searching. Raising the code default alone would not have.
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-8}
      - SEARCH_MAX_CONTENT_CHARS=${SEARCH_MAX_CONTENT_CHARS:-6000}
      - SEARCH_RESULT_CHARS=${SEARCH_RESULT_CHARS:-2500}
      - SEARCH_PAYLOAD_CHARS=${SEARCH_PAYLOAD_CHARS:-24000}
      - MCP_MAX_RESULT_CHARS=${MCP_MAX_RESULT_CHARS:-32000}
      - SEARCH_DEPTH=${SEARCH_DEPTH:-advanced}
      - SEARCH_MIN_SCORE=${SEARCH_MIN_SCORE:-0.4}
      - SEARCH_MAX_ROUNDS=${SEARCH_MAX_ROUNDS:-3}
      - SEARCH_MIN_ROUNDS=${SEARCH_MIN_ROUNDS:-2}
      - MEMORY_RECALL_TURNS_ENABLED=${MEMORY_RECALL_TURNS_ENABLED:-true}
      - MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE=${MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE:-0.45}
      - MEMORY_RECALL_TURNS_MAX_RESULTS=${MEMORY_RECALL_TURNS_MAX_RESULTS:-3}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_SEARCH_ENABLED=${GOOGLE_SEARCH_ENABLED:-false}
      - GOOGLE_SEARCH_MODEL=${GOOGLE_SEARCH_MODEL:-gemini-3.6-flash}
      - GOOGLE_SEARCH_TIMEOUT_SECONDS=${GOOGLE_SEARCH_TIMEOUT_SECONDS:-30}
      - GOOGLE_SEARCH_MAX_OUTPUT_TOKENS=${GOOGLE_SEARCH_MAX_OUTPUT_TOKENS:-2048}
      - GOOGLE_SEARCH_DAILY_LIMIT=${GOOGLE_SEARCH_DAILY_LIMIT:-450}
      - GOOGLE_SEARCH_QUOTA_DB_PATH=/app/data/search/google_search_quota.sqlite3
      - MCP_SERVERS_JSON=${MCP_SERVERS_JSON:-[]}
      - PRESENTATION_JOB_POLL_SECONDS=${PRESENTATION_JOB_POLL_SECONDS:-0.5}
      - PRESENTATION_JOB_LEASE_SECONDS=${PRESENTATION_JOB_LEASE_SECONDS:-300}
      - PRESENTATION_JOB_HEARTBEAT_SECONDS=${PRESENTATION_JOB_HEARTBEAT_SECONDS:-30}
      - REDIS_URL=redis://redis:6379/0
      - MODEL_GATE_ENABLED=true
      - MODEL_GATE_LEASE_SECONDS=${MODEL_GATE_LEASE_SECONDS:-300}
      - MODEL_GATE_POLL_SECONDS=${MODEL_GATE_POLL_SECONDS:-0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - artifactdata:/app/data/artifacts
      # The Google research quota counter is shared with the API, so both
      # processes reserve against one count rather than two.
      - searchdata:/app/data/search
    depends_on:
      vllm-main:
        condition: service_healthy
      db:
        condition: service_healthy
      presentation-renderer:
        condition: service_healthy
      redis:
        condition: service_started

  # The ambient discovery loop. Separate from the presentation worker because
  # the two have nothing in common but the leasing pattern: this one reads
  # feeds and embeddings, never the generation model, so it must not wait on
  # vllm-main to be healthy before it can run.
  discovery-worker:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build: .
    container_name: anios_discovery_worker
    command:
      - python
      - -m
      - backend.workers.discovery_worker
    environment:
      # Otherwise nothing this worker logs is visible until its stdout buffer
      # fills, which for a loop that sleeps between sweeps is effectively never.
      # The API appears to log fine without this only because uvicorn configures
      # its own handlers; a plain `python -m` process does not, so a whole
      # sweep's worth of evidence sat unflushed in a container reporting healthy.
      - PYTHONUNBUFFERED=1
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      # The worker writes sealed columns (a seen item's title), so it needs
      # the same key as the API — otherwise it stores plaintext into a column
      # the API reads as sealed.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - INFERENCE_ADAPTER=${INFERENCE_ADAPTER:-openai_compatible}
      - INFERENCE_PROVIDER_NAME=vllm
      - EMBEDDING_BASE_URL=http://vllm-embedding:8000
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      # Egress stays off unless the operator turns it on deliberately.
      - DISCOVERY_EGRESS_ENABLED=${DISCOVERY_EGRESS_ENABLED:-false}
      - DISCOVERY_IMESSAGE_SERVER_ID=${DISCOVERY_IMESSAGE_SERVER_ID:-imessage}
      - DISCOVERY_IMESSAGE_TOOL=${DISCOVERY_IMESSAGE_TOOL:-send_message}
      - DISCOVERY_CALENDAR_BASE_URL=${DISCOVERY_CALENDAR_BASE_URL:-http://localhost:8000/api/v1/discovery}
      - DISCOVERY_POLL_SECONDS=${DISCOVERY_POLL_SECONDS:-60}
      - DISCOVERY_RUN_LEASE_SECONDS=${DISCOVERY_RUN_LEASE_SECONDS:-300}
      - DISCOVERY_RUN_HEARTBEAT_SECONDS=${DISCOVERY_RUN_HEARTBEAT_SECONDS:-60}
      - DISCOVERY_PLACE_RESOLVER=${DISCOVERY_PLACE_RESOLVER:-}
      - DISCOVERY_PLACE_RESOLVER_URL=${DISCOVERY_PLACE_RESOLVER_URL:-https://nominatim.openstreetmap.org/reverse}
      - DISCOVERY_PLACE_RESOLVER_USER_AGENT=${DISCOVERY_PLACE_RESOLVER_USER_AGENT:-AniOS/1.0 (local personal assistant)}
      # Must match the backend's value: the two share one pool, so a
      # disagreement means each enforces a different ceiling on it.
      - SEARCH_MONTHLY_CREDITS=${SEARCH_MONTHLY_CREDITS:-1000}
      - MCP_SERVERS_JSON=${MCP_SERVERS_JSON:-[]}
      # Without these the sweep has no search provider, and a profile with no
      # feeds then reads zero events and finds nothing — every week, silently,
      # while the same account finds things through the API because the backend
      # container does have them. The credits line above was here on its own,
      # which made it look like search was already wired up.
      - SEARCH_PROVIDER_NAME=${SEARCH_PROVIDER_NAME:-tavily}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - SEARCH_MCP_SERVER_ID=${SEARCH_MCP_SERVER_ID:-internet}
      - SEARCH_MCP_TOOL_NAME=${SEARCH_MCP_TOOL_NAME:-search_web}
      # Declared so they reach the internet MCP subprocess too, which
      # inherits SEARCH_* from this environment and does the actual
      # searching. Raising the code default alone would not have.
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-8}
      - SEARCH_MAX_CONTENT_CHARS=${SEARCH_MAX_CONTENT_CHARS:-6000}
      - SEARCH_RESULT_CHARS=${SEARCH_RESULT_CHARS:-2500}
      - SEARCH_PAYLOAD_CHARS=${SEARCH_PAYLOAD_CHARS:-24000}
      - MCP_MAX_RESULT_CHARS=${MCP_MAX_RESULT_CHARS:-32000}
      - SEARCH_DEPTH=${SEARCH_DEPTH:-advanced}
      - SEARCH_MIN_SCORE=${SEARCH_MIN_SCORE:-0.4}
      - SEARCH_MAX_ROUNDS=${SEARCH_MAX_ROUNDS:-3}
      - SEARCH_MIN_ROUNDS=${SEARCH_MIN_ROUNDS:-2}
      - MEMORY_RECALL_TURNS_ENABLED=${MEMORY_RECALL_TURNS_ENABLED:-true}
      - MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE=${MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE:-0.45}
      - MEMORY_RECALL_TURNS_MAX_RESULTS=${MEMORY_RECALL_TURNS_MAX_RESULTS:-3}
      - DISCOVERY_WEB_SEARCH_ENABLED=${DISCOVERY_WEB_SEARCH_ENABLED:-true}
      # Off means every sweep reports everything it finds, including what it
      # has shown before. Useful while judging output; not what you want on a
      # schedule.
      - DISCOVERY_NOVELTY_ENABLED=${DISCOVERY_NOVELTY_ENABLED:-true}
      - DISCOVERY_WEB_QUERIES_PER_SWEEP=${DISCOVERY_WEB_QUERIES_PER_SWEEP:-4}
      # Whether a sweep aims its queries and its ranking at the person using
      # approved memory, or searches the bare interest label as it always did.
      # Both must match the backend's values: the API runs rehearsals, and a
      # rehearsal that aims differently from the scheduled run is not a
      # rehearsal of anything.
      - DISCOVERY_PERSONAL_QUERIES_ENABLED=${DISCOVERY_PERSONAL_QUERIES_ENABLED:-true}
      - DISCOVERY_MEMORY_RERANK_ENABLED=${DISCOVERY_MEMORY_RERANK_ENABLED:-true}
      # The cross-encoder that orders the shortlist. It runs in-process on CPU
      # from weights baked into the image, so this switch is the only thing
      # either service needs; both must agree, or a rehearsal orders finds
      # differently from the scheduled sweep that follows it.
      - DISCOVERY_CROSS_ENCODER_ENABLED=${DISCOVERY_CROSS_ENCODER_ENABLED:-true}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_SEARCH_ENABLED=${GOOGLE_SEARCH_ENABLED:-false}
      - GOOGLE_SEARCH_MODEL=${GOOGLE_SEARCH_MODEL:-gemini-3.6-flash}
      - GOOGLE_SEARCH_DAILY_LIMIT=${GOOGLE_SEARCH_DAILY_LIMIT:-450}
      - GOOGLE_SEARCH_QUOTA_DB_PATH=/app/data/search/google_search_quota.sqlite3
      # The sweep writes each find's description with the model, falling back to
      # a first-sentence extract when it cannot. Undeclared, LLM_BASE_URL
      # defaults to 127.0.0.1:8003 — the host's address, which inside this
      # container is nothing — so the call always failed and every digest
      # silently used the fallback. The failure is invisible by design, because
      # falling back is the correct behaviour when the model is genuinely down.
      - LLM_BASE_URL=http://vllm-main:8000
      - LLM_MODEL=qwen/qwen3.5-4b
      - MAIN_LLM_BASE_URL=http://vllm-main:8000
      - MAIN_LLM_MODEL=qwen/qwen3.5-4b
      # Empty rather than DeepSeek's date: a wrong cutoff is worse than
      # none, because the model would trust everything before it.
      - MAIN_LLM_TRAINING_CUTOFF=${QWEN_TRAINING_CUTOFF:-}
      - INFERENCE_ADAPTER=${INFERENCE_ADAPTER:-openai_compatible}
      # Same shape of mistake: the default is a loopback address that resolves
      # to this container rather than to the shared Redis.
      - REDIS_URL=redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The Google quota counter is shared with the API so both reserve against
      # one count rather than two.
      - searchdata:/app/data/search
    depends_on:
      db:
        condition: service_healthy
      vllm-embedding:
        condition: service_healthy

  backend:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build: .
    container_name: anios_backend
    ports:
      - "8000:8000"
    environment:
      # Credentials come from .env; the container-only values below stay literal
      # because .env holds host-oriented ones (POSTGRES_HOST=localhost).
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      # No default: a missing secret must fail the run, never fall back to a
      # committed placeholder that would sign real auth tokens.
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - AUTH_LOCAL_USER_ID=${AUTH_LOCAL_USER_ID:-ani.mallya}
      - AUTH_SESSION_TTL_HOURS=${AUTH_SESSION_TTL_HOURS:-168}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_SAMESITE=${AUTH_COOKIE_SAMESITE:-lax}
      - AUTH_TRUSTED_ORIGINS=${AUTH_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - AUTH_LOGIN_MAX_FAILURES=${AUTH_LOGIN_MAX_FAILURES:-8}
      - AUTH_LOGIN_FAILURE_WINDOW_SECONDS=${AUTH_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      - AUTH_LOGIN_GLOBAL_MAX_ATTEMPTS=${AUTH_LOGIN_GLOBAL_MAX_ATTEMPTS:-120}
      - AUTH_LOGIN_GLOBAL_WINDOW_SECONDS=${AUTH_LOGIN_GLOBAL_WINDOW_SECONDS:-60}
      # Seals free-text columns at rest. Empty disables it; every service
      # that writes a sealed column needs the same key, or one of them
      # stores plaintext into a column another reads as sealed.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Reverse geocoding for the Agents tab location button. Empty disables
      # it; typing a town needs nothing here.
      - DISCOVERY_PLACE_RESOLVER=${DISCOVERY_PLACE_RESOLVER:-}
      - DISCOVERY_PLACE_RESOLVER_URL=${DISCOVERY_PLACE_RESOLVER_URL:-https://nominatim.openstreetmap.org/reverse}
      - DISCOVERY_PLACE_RESOLVER_USER_AGENT=${DISCOVERY_PLACE_RESOLVER_USER_AGENT:-AniOS/1.0 (local personal assistant)}
      - DISCOVERY_EGRESS_ENABLED=${DISCOVERY_EGRESS_ENABLED:-false}
      # Must match the worker's value: the API can run a sweep too, and the
      # two disagreeing means a rehearsal and a real run filter differently.
      - DISCOVERY_NOVELTY_ENABLED=${DISCOVERY_NOVELTY_ENABLED:-true}
      # Must match the worker's values for the same reason: a rehearsal run
      # from here has to aim its queries and its ranking exactly as the
      # scheduled sweep will.
      - DISCOVERY_PERSONAL_QUERIES_ENABLED=${DISCOVERY_PERSONAL_QUERIES_ENABLED:-true}
      - DISCOVERY_MEMORY_RERANK_ENABLED=${DISCOVERY_MEMORY_RERANK_ENABLED:-true}
      # The cross-encoder that orders the shortlist. It runs in-process on CPU
      # from weights baked into the image, so this switch is the only thing
      # either service needs; both must agree, or a rehearsal orders finds
      # differently from the scheduled sweep that follows it.
      - DISCOVERY_CROSS_ENCODER_ENABLED=${DISCOVERY_CROSS_ENCODER_ENABLED:-true}
      # Which server owns the Apple device, and what its send tool is called.
      # The worker had these and this did not, so a send from the API would
      # resolve the tool name to its code default - `send_message`, which the
      # bridge does not expose - and fail as a withdrawn tool, with nothing
      # pointing at the missing key.
      - DISCOVERY_IMESSAGE_SERVER_ID=${DISCOVERY_IMESSAGE_SERVER_ID:-imessage}
      - DISCOVERY_IMESSAGE_TOOL=${DISCOVERY_IMESSAGE_TOOL:-send_message}
      - DISCOVERY_CALENDAR_BASE_URL=${DISCOVERY_CALENDAR_BASE_URL:-http://localhost:8000/api/v1/discovery}
      # vLLM runs as pinned sibling services with independent generation and
      # embedding endpoints.
      - LLM_BASE_URL=http://vllm-main:8000
      - LLM_MODEL=qwen/qwen3.5-4b
      - INFERENCE_ADAPTER=${INFERENCE_ADAPTER:-openai_compatible}
      - INFERENCE_PROVIDER_NAME=vllm
      # Conversational replies only (build_assistant_graph / stream_chat).
      # DeepSeek-V4-Flash beat Qwen and Nemotron on every category of a
      # blind 6-prompt evaluation (2026-08-14) and never failed to answer,
      # unlike Nemotron (hard-failed 2/6, blew its token budget on hidden
      # reasoning) and unlike Qwen itself, which never finished the
      # multi-step word problem. Cost: ~5x Qwen's total reply time
      # (~32s vs ~6s avg), accepted as the intelligence/speed tradeoff.
      - MAIN_INFERENCE_ADAPTER=${MAIN_INFERENCE_ADAPTER:-}
      - MAIN_LLM_BASE_URL=${MAIN_LLM_BASE_URL:-http://spark-b524.local:8888}
      - MAIN_LLM_MODEL=${MAIN_LLM_MODEL:-deepseek-v4-flash}
      # Belongs with the model above, not with the deployment: it states
      # which of that model's beliefs are already stale, and the gap
      # between it and today is what a web search is for. Change it when
      # the model changes. DeepSeek does not publish cutoffs; this is the
      # measured value: it names Qwen2.5 as the newest Qwen it knows and
      # believes the year is 2024.
      - MAIN_LLM_TRAINING_CUTOFF=${MAIN_LLM_TRAINING_CUTOFF:-2024-07}
      # Sized from measurement: at the old 1,024 one reply in six came back
      # empty, because the model spends part of the budget on thinking that
      # is never rendered and the stream then carries no content at all.
      - MAIN_LLM_MAX_TOKENS=${MAIN_LLM_MAX_TOKENS:-4096}
      # Measure what a turn costs; do not act on it yet. Enforcement stays
      # off until the section priorities have been argued against real turn
      # sizes rather than assumed.
      - CONTEXT_BUDGET_ENABLED=${CONTEXT_BUDGET_ENABLED:-true}
      - CONTEXT_BUDGET_ENFORCE=${CONTEXT_BUDGET_ENFORCE:-false}
      - CONTEXT_BUDGET_TOKENS=${CONTEXT_BUDGET_TOKENS:-32768}
      # This turn's volatile blocks go after the history, so the prefix above
      # them stays byte-identical and the server reuses its KV cache.
      # Measured on the reply model: 16.3s -> 2.0s on a second turn.
      - CONTEXT_CACHE_ORDERING=${CONTEXT_CACHE_ORDERING:-true}
      # The conversation digest is written by the reply model, falling back
      # to bounded truncation whenever that fails. Runs once per interval,
      # after the reply is sent, so it never delays an answer.
      - MEMORY_DIGEST_MODEL_ENABLED=${MEMORY_DIGEST_MODEL_ENABLED:-true}
      - MEMORY_DIGEST_MAX_WORDS=${MEMORY_DIGEST_MAX_WORDS:-200}
      - MEMORY_DIGEST_MAX_TOKENS=${MEMORY_DIGEST_MAX_TOKENS:-2048}
      - MAIN_LLM_REASONING_EFFORT=${MAIN_LLM_REASONING_EFFORT:-none}
      # Where the main model's work goes when the Spark is powered off. Without
      # this the assistant is entirely down whenever that machine is, even
      # though vllm-main is running healthily right here. Degraded replies beat
      # no replies.
      - MAIN_LLM_STANDBY_BASE_URL=http://vllm-main:8000
      - MAIN_LLM_STANDBY_MODEL=qwen/qwen3.5-4b
      - MAIN_LLM_STANDBY_REASONING_EFFORT=${MAIN_LLM_STANDBY_REASONING_EFFORT:-none}
      # MainActionSelector's tool-calling/routing stays on Qwen deliberately -
      # pinned here rather than left to fall back to MAIN_LLM_*, since without
      # this MainActionSelector's native tool calls would silently move to
      # DeepSeek too. Qwen's routing/tool-calling was the proven baseline all
      # session; DeepSeek's own routing eval passed only barely (recall right
      # at the 0.85 floor), so there was no evidence to justify moving it.
      - ROUTING_INFERENCE_ADAPTER=${ROUTING_INFERENCE_ADAPTER:-}
      - ROUTING_LLM_BASE_URL=http://vllm-main:8000
      - ROUTING_LLM_MODEL=qwen/qwen3.5-4b
      - ROUTING_LLM_REASONING_EFFORT=${ROUTING_LLM_REASONING_EFFORT:-none}
      - PRESENTATION_INFERENCE_ADAPTER=${PRESENTATION_INFERENCE_ADAPTER:-}
      - PRESENTATION_LLM_BASE_URL=http://vllm-main:8000
      - PRESENTATION_LLM_MODEL=qwen/qwen3.5-4b
      - PRESENTATION_LLM_REASONING_EFFORT=${PRESENTATION_LLM_REASONING_EFFORT:-none}
      - DIAGRAM_INFERENCE_ADAPTER=${DIAGRAM_INFERENCE_ADAPTER:-}
      - DIAGRAM_LLM_BASE_URL=http://vllm-main:8000
      - DIAGRAM_LLM_MODEL=qwen/qwen3.5-4b
      - DIAGRAM_LLM_REASONING_EFFORT=${DIAGRAM_LLM_REASONING_EFFORT:-none}
      - MEMORY_PROPOSAL_INFERENCE_ADAPTER=${MEMORY_PROPOSAL_INFERENCE_ADAPTER:-openai_compatible}
      - MEMORY_PROPOSAL_LLM_BASE_URL=http://vllm-main:8000
      - MEMORY_PROPOSAL_LLM_MODEL=qwen/qwen3.5-4b
      - MEMORY_PROPOSAL_LLM_REASONING_EFFORT=${MEMORY_PROPOSAL_LLM_REASONING_EFFORT:-none}
      - MEMORY_PROPOSAL_MAX_TOKENS=${MEMORY_PROPOSAL_MAX_TOKENS:-1024}
      - VISION_INFERENCE_ADAPTER=${VISION_INFERENCE_ADAPTER:-}
      - VISION_LLM_BASE_URL=http://vllm-main:8000
      - VISION_MODEL=qwen/qwen3.5-4b
      - VISION_LLM_REASONING_EFFORT=${VISION_LLM_REASONING_EFFORT:-none}
      # Not previously passed at all, so the one number that decides whether
      # an upload's structured inspection fits could not be changed without
      # a rebuild.
      - VISION_MAX_TOKENS=${VISION_MAX_TOKENS:-1536}
      - VISION_ESCALATION_LLM_BASE_URL=${VISION_ESCALATION_LLM_BASE_URL:-}
      - VISION_ESCALATION_MODEL=${VISION_ESCALATION_MODEL:-}
      - VISION_ESCALATION_LLM_REASONING_EFFORT=${VISION_ESCALATION_LLM_REASONING_EFFORT:-none}
      - EMBEDDING_INFERENCE_ADAPTER=${EMBEDDING_INFERENCE_ADAPTER:-}
      - EMBEDDING_BASE_URL=http://vllm-embedding:8000
      - EMBEDDING_MODEL=text-embedding-nomic-embed-text-v1.5
      # Points at the host ComfyUI install (E:/AI/ComfyUI), started with
      # --listen 0.0.0.0 so the container can reach it. To use the sibling
      # `comfyui` service instead, run `--profile comfyui` and set this to
      # http://comfyui:8188 (that GPU image build needs ~10-20 GB free on C:).
      - IMAGE_PROVIDER_BASE_URL=http://host.docker.internal:8188
      # One FLUX.2 Klein checkpoint serves generation and editing alike, so
      # the model, text encoder and VAE are shared rather than per-role.
      - IMAGE_MODEL=${IMAGE_MODEL:-flux-2-klein-4b-fp8.safetensors}
      - IMAGE_TEXT_ENCODER=${IMAGE_TEXT_ENCODER:-qwen_3_4b.safetensors}
      - IMAGE_VAE=${IMAGE_VAE:-flux2-vae.safetensors}
      # The distilled model is a four-step sampler in both directions.
      - IMAGE_GENERATION_STEPS=${IMAGE_GENERATION_STEPS:-4}
      - IMAGE_EDIT_STEPS=${IMAGE_EDIT_STEPS:-4}
      # How much of the source survives into the edit, and how it is
      # resampled. Both were ComfyUI template defaults; `nearest-exact`
      # stipples any photograph, and the megapixel budget is the ceiling
      # on what comes back, because the output is generated at that size.
      - IMAGE_EDIT_MEGAPIXELS=${IMAGE_EDIT_MEGAPIXELS:-2.0}
      - IMAGE_EDIT_SCALE_METHOD=${IMAGE_EDIT_SCALE_METHOD:-lanczos}
      - IMAGE_EDIT_MODEL=${IMAGE_EDIT_MODEL:-}
      - IMAGE_EDIT_CLIP=${IMAGE_EDIT_CLIP:-clip_l.safetensors}
      - IMAGE_EDIT_T5=${IMAGE_EDIT_T5:-t5xxl_fp8_e4m3fn_scaled.safetensors}
      - IMAGE_EDIT_VAE=${IMAGE_EDIT_VAE:-ae.safetensors}
      - IMAGE_EDIT_KONTEXT_STEPS=${IMAGE_EDIT_KONTEXT_STEPS:-20}
      - IMAGE_EDIT_GUIDANCE=${IMAGE_EDIT_GUIDANCE:-2.5}
      - ARTIFACT_STORAGE_ROOT=/app/data/artifacts
      - PRESENTATION_RENDERER_BASE_URL=http://presentation-renderer:8002
      - PRESENTATION_REQUIRE_OFFICE_VALIDATION=true
      - PRESENTATION_RESEARCH_ENABLED=${PRESENTATION_RESEARCH_ENABLED:-true}
      # Opt-in web search. Empty disables it: routing still runs and logs its
      # decision, but no query is ever sent.
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - SEARCH_MONTHLY_CREDITS=${SEARCH_MONTHLY_CREDITS:-1000}
      - SEARCH_PROVIDER_NAME=${SEARCH_PROVIDER_NAME:-tavily}
      - SEARCH_MCP_SERVER_ID=${SEARCH_MCP_SERVER_ID:-internet}
      - SEARCH_MCP_TOOL_NAME=${SEARCH_MCP_TOOL_NAME:-search_web}
      # Declared so they reach the internet MCP subprocess too, which
      # inherits SEARCH_* from this environment and does the actual
      # searching. Raising the code default alone would not have.
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-8}
      - SEARCH_MAX_CONTENT_CHARS=${SEARCH_MAX_CONTENT_CHARS:-6000}
      - SEARCH_RESULT_CHARS=${SEARCH_RESULT_CHARS:-2500}
      - SEARCH_PAYLOAD_CHARS=${SEARCH_PAYLOAD_CHARS:-24000}
      - MCP_MAX_RESULT_CHARS=${MCP_MAX_RESULT_CHARS:-32000}
      - SEARCH_DEPTH=${SEARCH_DEPTH:-advanced}
      - SEARCH_MIN_SCORE=${SEARCH_MIN_SCORE:-0.4}
      - SEARCH_MAX_ROUNDS=${SEARCH_MAX_ROUNDS:-3}
      - SEARCH_MIN_ROUNDS=${SEARCH_MIN_ROUNDS:-2}
      - MEMORY_RECALL_TURNS_ENABLED=${MEMORY_RECALL_TURNS_ENABLED:-true}
      - MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE=${MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE:-0.45}
      - MEMORY_RECALL_TURNS_MAX_RESULTS=${MEMORY_RECALL_TURNS_MAX_RESULTS:-3}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_SEARCH_ENABLED=${GOOGLE_SEARCH_ENABLED:-false}
      - GOOGLE_SEARCH_MODEL=${GOOGLE_SEARCH_MODEL:-gemini-3.6-flash}
      - GOOGLE_SEARCH_TIMEOUT_SECONDS=${GOOGLE_SEARCH_TIMEOUT_SECONDS:-30}
      - GOOGLE_SEARCH_MAX_OUTPUT_TOKENS=${GOOGLE_SEARCH_MAX_OUTPUT_TOKENS:-2048}
      - GOOGLE_SEARCH_DAILY_LIMIT=${GOOGLE_SEARCH_DAILY_LIMIT:-450}
      - GOOGLE_SEARCH_QUOTA_DB_PATH=/app/data/search/google_search_quota.sqlite3
      - MCP_SERVERS_JSON=${MCP_SERVERS_JSON:-[]}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER=${OTEL_EXPORTER:-console}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - REDIS_URL=redis://redis:6379/0
      - MODEL_GATE_ENABLED=true
      - MODEL_GATE_LEASE_SECONDS=${MODEL_GATE_LEASE_SECONDS:-300}
      - MODEL_GATE_POLL_SECONDS=${MODEL_GATE_POLL_SECONDS:-0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - artifactdata:/app/data/artifacts
      - searchdata:/app/data/search
      # Context measurements accumulate across rebuilds here; docker logs do
      # not survive them, and enforcement floors need days of distribution.
      - telemetrydata:/app/data/telemetry
    depends_on:
      vllm-main:
        condition: service_healthy
      vllm-embedding:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
      local-capabilities:
        condition: service_started
      presentation-renderer:
        condition: service_healthy
      presentation-worker:
        condition: service_started

  frontend:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: anios_frontend
    ports:
      - "5173:5173"
    environment:
      # Poll the bind-mounted source so hot reload fires across the Docker mount.
      - VITE_USE_POLLING=true
    volumes:
      - ./frontend:/app
      # Keep the image's installed node_modules instead of the host's (if any).
      - /app/node_modules
    depends_on:
      - backend

  gateway:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.gateway
    container_name: anios_gateway
    # The tunnel targets one loopback-only port; no LAN or public socket is
    # opened, so ingress cannot reach anything the gateway does not serve.
    #
    # Both loopback families, because "localhost" does not mean one address. The
    # tunnel running as a Windows service resolved it to ::1, found nothing
    # listening, and answered every public request with 502 while the same URL
    # worked from a user shell over 127.0.0.1. Binding both makes the origin
    # reachable however the resolver happens to order them, and neither is
    # reachable from outside this machine.
    ports:
      - "127.0.0.1:${ANIOS_GATEWAY_PORT:-8080}:8080"
      - "[::1]:${ANIOS_GATEWAY_PORT:-8080}:8080"
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 5s
      timeout: 3s
      retries: 12


  comfyui:
    build:
      context: ./docker/comfyui
    container_name: anios_comfyui
    # Comes back when Docker does, like every other service here. This was the
    # one that never got the line, which is exactly how it behaved: the whole
    # stack returned after a reboot and image generation alone did not, with
    # every container reporting healthy while every picture failed. `profiles`
    # gates `up`, not restart -- once this container exists the daemon brings it
    # back on its own.
    restart: unless-stopped
    # Opt-in: heavy GPU image build. Start with `docker compose --profile comfyui up`.
    profiles: ["comfyui"]
    ports:
      - "8188:8188"
    volumes:
      # Bind-mount your existing ComfyUI install (code, custom nodes, and models).
      - ${COMFYUI_HOST_PATH:-E:/AI/ComfyUI}:/comfyui
    # `/` answers 200 from a ComfyUI whose CUDA context has died, so liveness is
    # read from the endpoint that actually exercises the device. Docker will not
    # restart on this by itself, but it makes the failure visible in `docker ps`
    # instead of only in a user's failed image request.
    # python3 rather than curl: this image ships neither curl nor wget, and a
    # probe that cannot run reports the service unhealthy for the wrong reason.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          try:
              r = urllib.request.urlopen(
                  "http://localhost:8188/system_stats", timeout=8
              )
          except Exception:
              sys.exit(1)
          sys.exit(0 if r.status == 200 else 1)
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  memory-maintenance:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build: .
    profiles: ["maintenance"]
    command:
      - python
      - -m
      - backend.cli.run_memory_maintenance
      - --all-users
      - --strict
      - --interval-seconds
      - "3600"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
    depends_on:
      db:
        condition: service_healthy

  storage-collection:
    # Deleting a row and deleting its bytes cannot be one atomic act across a
    # database and a filesystem, so a leak stays possible however carefully
    # each call site deletes. One sweep found 460 MB of 556 MB unreachable.
    # This bounds that in time rather than letting it accumulate forever.
    #
    # The grace period is a day, far longer than the gap between a render
    # writing its bytes and recording its row, because the cost of waiting is a
    # delayed sweep and the cost of being wrong is someone's deck.
    restart: unless-stopped
    build: .
    profiles: ["maintenance"]
    command:
      - python
      - -m
      - backend.cli.collect_storage
      - --apply
      - --grace-seconds
      - "86400"
      - --interval-seconds
      - "21600"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      - ARTIFACT_STORAGE_ROOT=/app/data/artifacts
    volumes:
      - artifactdata:/app/data/artifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  artifactdata:
  searchdata:
  telemetrydata:
