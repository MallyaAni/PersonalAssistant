# Bounded container logs. Without this Docker's json-file driver keeps every
# line forever, and a backend that logs each HTTP request grows gigabytes of
# log over months - the classic quiet disk-eater. 20MB x 3 files per service
# keeps ~60MB of recent history each, which is plenty for any diagnosis that
# happens while the incident is still warm.
x-spark-hosts: &spark-hosts
  # The two DGX Sparks, by address rather than by name.
  #
  # Every service below reaches Postgres, Redis and the models over
  # `animallya-sparkN.local`, which is mDNS. mDNS does not work inside a Docker
  # container: Docker's embedded resolver forwards to the host's *upstream*
  # nameservers, and the .local responder is not one of them. On the Sparks the
  # failure is worse than a clean NXDOMAIN - spark1 resolves to a list of
  # link-local IPv6 addresses (fe80::/10) that cannot be routed without a scope
  # id, so connections hang or fail with "Temporary failure in name
  # resolution", while /health keeps answering 200 because it touches nothing.
  #
  # Pinning both to their LAN addresses makes resolution identical on every
  # host and independent of whether an mDNS responder is running at all.
  - "animallya-spark1.local:${SPARK1_IP:-172.16.8.3}"
  - "animallya-spark2.local:${SPARK2_IP:-172.16.8.5}"
  # Reaching back to whatever host the container happens to run on.
  - "host.docker.internal:host-gateway"

x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  vllm-embedding:
    extra_hosts: *spark-hosts
    # Pinned by digest, which pins the architecture too - this one is amd64.
    # The DGX Sparks are aarch64 and override it with an ARM vLLM build, so
    # one service definition serves both hosts.
    image: ${VLLM_EMBEDDING_IMAGE:-vllm/vllm-openai@sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f}
    container_name: anios_vllm_embedding
    logging: *bounded-logs
    ipc: host
    command:
      - nomic-ai/nomic-embed-text-v1.5
      - --revision
      - e9b6763023c676ca8431644204f50c2b100d9aab
      - --code-revision
      - 7710840340a098cfb869c4f65e87cf2b1b70caca
      - --served-model-name
      - text-embedding-nomic-embed-text-v1.5
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --runner
      - pooling
      - --convert
      - embed
      - --trust-remote-code
      - --max-model-len
      - ${VLLM_EMBEDDING_MAX_MODEL_LEN:-2048}
      - --max-num-seqs
      - ${VLLM_EMBEDDING_MAX_NUM_SEQS:-16}
      # Nomic's weights load in ~0.26 GiB; 0.15 reserved ~2.4 GiB that nothing
      # used. Size this to the measured footprint plus pooling headroom.
      - --gpu-memory-utilization
      - ${VLLM_EMBEDDING_GPU_MEMORY_UTILIZATION:-0.06}
    ports:
      - "8004:8000"
    volumes:
      - ${VLLM_MODEL_CACHE_PATH:-E:/AI/huggingface-cache-vllm}:/root/.cache/huggingface
      - ${VLLM_COMPILE_CACHE_PATH:-E:/AI/vllm-compile-cache}:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 3m
    restart: unless-stopped

  # vllm-reranker was retired 2026-09-03. Recall reordering and Scout's
  # precision ranking both run on the local ONNX cross-encoder, which
  # measured 5/5 at 39.6ms against the served model's 2/5 at 67.6ms, and
  # the container was holding 3.6 GB on a box already 12 GB into swap.
  # RERANKER_BASE_URL is kept as a setting with no default host: setting
  # it and RECALL_RERANKER_SOURCE=service is how a served reranker comes
  # back, and Qwen3-VL-Reranker speaks the same /v2/rerank contract.
  functional-tests:
    # The deploy gate. Never started by `docker compose up`: the profile keeps
    # it out of every ordinary command, and it only ever runs via
    # `docker compose run` from scripts/gate.sh.
    #
    # `target: test` is the one place that stage is asked for. Every serving
    # service leaves `target` unset and gets `runtime`, which is the last stage.
    profiles:
      - test
    build:
      context: .
      target: test
    image: anios-functional-tests
    extra_hosts: *spark-hosts
    environment:
      # backend/tests/conftest.py sets ANIOS_TEST_MODE=1, which makes settings
      # ignore .env entirely (env_file=None). Every value the gate needs must
      # therefore arrive as real process environment - inheriting it from the
      # file the rest of the stack uses is exactly what does not happen here.
      - ANIOS_TEST_MODE=1
      # Turns every skip in backend/tests/functional into a failure. Without it
      # a gate passes when the Sparks are simply unreachable.
      - ANIOS_REQUIRE_FUNCTIONAL=1
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?the gate needs the real key to build settings}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - MCP_SERVERS_JSON=${MCP_SERVERS_JSON:?the gate needs the internet server}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - SEARCH_BASE_URL=${SEARCH_BASE_URL:-}
      - SEARCH_MCP_SERVER_ID=${SEARCH_MCP_SERVER_ID:-internet}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - BRAVE_SEARCH_MONTHLY_LIMIT=${BRAVE_SEARCH_MONTHLY_LIMIT:-900}
      - BRAVE_SEARCH_QUOTA_DB_PATH=${BRAVE_SEARCH_QUOTA_DB_PATH:-/app/data/search/brave_search_quota.sqlite3}
      - SEARCH_PROVIDER_ORDER=${SEARCH_PROVIDER_ORDER:-brave,google,tavily}
      - MAIN_LLM_BASE_URL=${MAIN_LLM_BASE_URL:-http://animallya-spark1.local:8000}
      - MAIN_LLM_MODEL=${MAIN_LLM_MODEL:-deepseek-v4-flash}
      - ROUTING_LLM_BASE_URL=${ROUTING_LLM_BASE_URL:-http://animallya-spark1.local:8000}
      - ROUTING_LLM_MODEL=${ROUTING_LLM_MODEL:-deepseek-v4-flash}
      - VISION_BASE_URL=${VISION_BASE_URL:-http://animallya-spark2.local:8001}
      - VISION_MODEL=${VISION_MODEL:-qwen3-vl-8b}
      # The picture tests reach the desktop's ComfyUI with the deployed
      # recipe; without these the test container asked for a model file the
      # desktop does not have (400) and read pictures back from a server
      # that does not exist (2026-08-27).
      - IMAGE_PROVIDER_BASE_URL=${IMAGE_PROVIDER_BASE_URL:-http://127.0.0.1:8188}
      - IMAGE_MODEL=${IMAGE_MODEL:-flux-2-klein-9b-fp8.safetensors}
      - IMAGE_TEXT_ENCODER=${IMAGE_TEXT_ENCODER:-qwen_3_8b_fp8mixed.safetensors}
      - IMAGE_VAE=${IMAGE_VAE:-flux2-vae.safetensors}
      - IMAGE_GENERATION_STEPS=${IMAGE_GENERATION_STEPS:-4}
      - IMAGE_EDIT_MODEL=${IMAGE_EDIT_MODEL:-}
      - IMAGE_EDIT_MEGAPIXELS=${IMAGE_EDIT_MEGAPIXELS:-2.0}
      # Inside the compose network the embedder is the service, not the
      # host-published port .env names for the operator's shell: a functional
      # test that embeds (a member's memory found by relevance) needs this one.
      - EMBEDDING_BASE_URL=http://vllm-embedding:8000
      - RERANKER_BASE_URL=${RERANKER_BASE_URL:-}
      - RERANKER_MODEL=${RERANKER_MODEL:-qwen3-reranker-0.6b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      # Literal, not interpolated: spark1's .env carries a host-oriented value
      # that would otherwise leak in and point the gate at the published port,
      # which since 2026-08-25 answers only on the host's loopback.
      - POSTGRES_HOST=db
      - DATABASE_USE_NULL_POOL=true
    # Nothing to serve; gate.sh supplies the command.
    command: ["python", "-m", "pytest", "--version"]


  db:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    container_name: anios_db
    logging: *bounded-logs
    ports:
      # Loopback only. Other containers reach the database over the compose
      # network by name, and host tooling (backup, psql) uses `compose exec`,
      # so nothing needs this on 0.0.0.0 - where it sat with a default password,
      # reachable by anything on the LAN. Bind to the host's loopback instead.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-anios_db}
    # Point-in-time recovery. The nightly dump alone meant a failure at 03:29
    # lost the day. With WAL archiving every completed segment is copied into
    # the walarchive volume (never overwriting one already there), a segment is
    # forced closed at least every five minutes so the archive lags the live
    # database by no more than that, and backup-db.sh takes a base backup
    # beside it and ships both to the mirrors. Restore procedure: RESTORE.md.
    # The volume must be owned by postgres: Docker creates a new named volume
    # root-owned, archive_command runs as postgres, and every segment then
    # fails to archive while pg_wal quietly grows. backup-db.sh corrects the
    # ownership before each base backup; do the same by hand on a fresh host.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
      - -c
      - archive_timeout=300
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal-archive
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-anios_db}"
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    image: redis:7-alpine
    container_name: anios_redis
    # Named, because this is not a cache. Redis holds the iMessage read cursor,
    # and without a named volume the data sat in an anonymous one that any
    # recreate would abandon - the container would come back empty and the
    # bridge would silently replay or skip messages with nothing logged.
    volumes:
      - redisdata:/data
    # Append-only, because the snapshot default loses the cursor. `save 3600 1`
    # means an idle-ish hour can pass between snapshots, so a crash rolls the
    # read cursor back to whatever it was at the last one - and the seen-guid
    # markers that would have caught the replay roll back in the same snapshot,
    # so they cannot. The user gets answered twice for messages already handled.
    # everysec bounds that to about a second of writes; this is 6k small keys,
    # so the fsync cost is not measurable against the failure it removes.
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --save 3600 1 300 100 60 10000
    logging: *bounded-logs
    ports:
      # Loopback only, same reasoning as the database: reached by name over the
      # compose network, never needed on the LAN, and it holds the iMessage
      # cursor with no password set. Do not widen without a requirepass.
      - "127.0.0.1:6379:6379"

  local-capabilities:
    # The one service that was missing this. After a host reboot every sibling
    # came back and this did not, so the MCP capabilities server was simply
    # absent and tool calls had nothing to reach.
    restart: unless-stopped
    build: .
    container_name: anios_local_capabilities
    logging: *bounded-logs
    command:
      - python
      - -m
      - backend.capabilities.visual_mcp
    ports:
      - "8001:8001"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      - LLM_BASE_URL=http://animallya-spark1.local:8000
      - LLM_MODEL=deepseek-v4-flash
      - INFERENCE_ADAPTER=${INFERENCE_ADAPTER:-openai_compatible}
      - INFERENCE_PROVIDER_NAME=vllm
      - MAIN_INFERENCE_ADAPTER=${MAIN_INFERENCE_ADAPTER:-}
      - MAIN_LLM_BASE_URL=http://animallya-spark1.local:8000
      - MAIN_LLM_MODEL=deepseek-v4-flash
      # A turn may take more than one bookkeeping step. Ships at 1, so the
      # loop is unreachable until this is raised. iMessage turns run in
      # discovery-worker, so leaving it out here would flip the setting for
      # the web and not for the channel most people actually use.
      - TURN_MAX_STEPS=${TURN_MAX_STEPS:-1}
      - TURN_STEP_BUDGET_SECONDS=${TURN_STEP_BUDGET_SECONDS:-45}
      # Empty rather than DeepSeek's date: a wrong cutoff is worse than
      # none, because the model would trust everything before it.
      - MAIN_LLM_TRAINING_CUTOFF=${QWEN_TRAINING_CUTOFF:-}
      - MAIN_LLM_REASONING_EFFORT=${MAIN_LLM_REASONING_EFFORT:-none}
      - PRESENTATION_INFERENCE_ADAPTER=${PRESENTATION_INFERENCE_ADAPTER:-}
      - PRESENTATION_LLM_BASE_URL=http://animallya-spark1.local:8000
      - PRESENTATION_LLM_MODEL=deepseek-v4-flash
      - PRESENTATION_LLM_REASONING_EFFORT=${PRESENTATION_LLM_REASONING_EFFORT:-none}
      - DIAGRAM_INFERENCE_ADAPTER=${DIAGRAM_INFERENCE_ADAPTER:-}
      - DIAGRAM_LLM_BASE_URL=http://animallya-spark1.local:8000
      - DIAGRAM_LLM_MODEL=deepseek-v4-flash
      - DIAGRAM_LLM_REASONING_EFFORT=${DIAGRAM_LLM_REASONING_EFFORT:-none}
      - VISION_INFERENCE_ADAPTER=${VISION_INFERENCE_ADAPTER:-}
      - VISION_LLM_BASE_URL=http://animallya-spark2.local:8001
      - VISION_MODEL=qwen3-vl-8b
      - VISION_LLM_REASONING_EFFORT=${VISION_LLM_REASONING_EFFORT:-none}
      # Not previously passed at all, so the one number that decides whether
      # an upload's structured inspection fits could not be changed without
      # a rebuild.
      - VISION_MAX_TOKENS=${VISION_MAX_TOKENS:-1536}
      - VISION_ESCALATION_LLM_BASE_URL=${VISION_ESCALATION_LLM_BASE_URL:-}
      - VISION_ESCALATION_MODEL=${VISION_ESCALATION_MODEL:-}
      - VISION_ESCALATION_LLM_REASONING_EFFORT=${VISION_ESCALATION_LLM_REASONING_EFFORT:-none}
      - EMBEDDING_INFERENCE_ADAPTER=${EMBEDDING_INFERENCE_ADAPTER:-}
      - EMBEDDING_BASE_URL=http://vllm-embedding:8000
      - EMBEDDING_MODEL=text-embedding-nomic-embed-text-v1.5
      # The reranker rides beside the embedder: it re-scores what the vector
      # search retrieved. It was wired into the test container only for a
      # day (2026-08-25) and fail-soft hid that the live stage was off.
      - RERANKER_BASE_URL=${RERANKER_BASE_URL:-}
      - RERANKER_MODEL=${RERANKER_MODEL:-qwen3-reranker-0.6b}
      - IMAGE_PROVIDER_BASE_URL=${IMAGE_PROVIDER_BASE_URL:-http://host.docker.internal:8188}
      # One FLUX.2 Klein checkpoint serves generation and editing alike, so
      # the model, text encoder and VAE are shared rather than per-role. The
      # 9B pair is the deployment's choice since 2026-08-25 (hosted on the
      # desktop's 16 GB card, which fits it at fp8); the encoder must be the
      # 8B one - the 4B encoder loads and produces garbage silently.
      - IMAGE_MODEL=${IMAGE_MODEL:-flux-2-klein-9b-fp8.safetensors}
      - IMAGE_TEXT_ENCODER=${IMAGE_TEXT_ENCODER:-qwen_3_8b_fp8mixed.safetensors}
      - IMAGE_VAE=${IMAGE_VAE:-flux2-vae.safetensors}
      # The distilled model is a four-step sampler in both directions.
      - IMAGE_GENERATION_STEPS=${IMAGE_GENERATION_STEPS:-4}
      - IMAGE_EDIT_STEPS=${IMAGE_EDIT_STEPS:-4}
      # How much of the source survives into the edit, and how it is
      # resampled. Both were ComfyUI template defaults; `nearest-exact`
      # stipples any photograph, and the megapixel budget is the ceiling
      # on what comes back, because the output is generated at that size.
      - IMAGE_EDIT_MEGAPIXELS=${IMAGE_EDIT_MEGAPIXELS:-1.0}
      - IMAGE_EDIT_SCALE_METHOD=${IMAGE_EDIT_SCALE_METHOD:-lanczos}
      - IMAGE_EDIT_MODEL=${IMAGE_EDIT_MODEL:-}
      - IMAGE_EDIT_CLIP=${IMAGE_EDIT_CLIP:-clip_l.safetensors}
      - IMAGE_EDIT_T5=${IMAGE_EDIT_T5:-t5xxl_fp8_e4m3fn_scaled.safetensors}
      - IMAGE_EDIT_VAE=${IMAGE_EDIT_VAE:-ae.safetensors}
      - IMAGE_EDIT_KONTEXT_STEPS=${IMAGE_EDIT_KONTEXT_STEPS:-20}
      - IMAGE_EDIT_GUIDANCE=${IMAGE_EDIT_GUIDANCE:-2.5}
      - ARTIFACT_STORAGE_ROOT=/app/data/artifacts
      - PRESENTATION_RENDERER_BASE_URL=http://presentation-renderer:8002
      - PRESENTATION_REQUIRE_OFFICE_VALIDATION=true
      # Slide calls read the outline, never each other, so they run together.
      - PRESENTATION_SLIDE_CONCURRENCY=${PRESENTATION_SLIDE_CONCURRENCY:-4}
    extra_hosts: *spark-hosts
    volumes:
      # The image embedder's weights, 374 MB of ONNX. data/ is in
      # .dockerignore so they are not in the image, and NomicVisionEmbedding
      # Provider disables itself when the file is absent rather than raising -
      # so a missing mount reads as "image search is off" with nothing logged.
      # Read-only: nothing should ever write here.
      - ./data/models:/app/data/models:ro
      - artifactdata:/app/data/artifacts
    depends_on:
      vllm-embedding:
        condition: service_healthy
      db:
        condition: service_healthy
      presentation-renderer:
        condition: service_healthy

  browser:
    # Microsoft's Playwright MCP server: the browser AniOS drives, as a tool
    # rather than as a second agent (ADR 0018). Chosen over writing one because
    # the navigation primitives, the browser lifecycle and - the part that
    # matters most - the accessibility-tree snapshot are somebody else's
    # maintained problem. That snapshot is why no vision model is in this loop:
    # the local DeepSeek reasons about real DOM semantics rather than pixels.
    #
    # Pinned by index digest, which resolves per architecture, so one line
    # serves the amd64 dev box and the aarch64 Sparks alike. `latest` here
    # would be the same hazard as `npx -y`, on a container that drives a real
    # browser against the open web.
    restart: unless-stopped
    image: mcr.microsoft.com/playwright/mcp:v0.0.79@sha256:18c0a9c934004fe9580cc79f1e8e6e6cde7c667348b215335e8a23fd3e509804
    container_name: anios_browser
    logging: *bounded-logs
    # Reaps the processes a browser leaves behind.
    init: true
    # Its own network, and only its own. Nothing here needs Postgres, Redis or
    # the model, and a container running third-party code that fetches the open
    # web should not be one hop from the database. `backend` and
    # `discovery-worker` join this network as well as the default one, so they
    # can reach it and it can reach nothing of ours.
    networks:
      - browser
    # No published port: siblings reach it at http://browser:8931/mcp and the
    # LAN does not reach it at all.
    entrypoint: ["node"]
    command:
      - /app/cli.js
      - --headless
      - --browser=chromium
      # Chromium's own sandbox needs privileges this container deliberately
      # does not have. The container is the sandbox instead: no capabilities,
      # no privilege escalation, its own network, and an in-memory profile.
      - --no-sandbox
      # The profile lives in memory and is never written to disk, so no cookie,
      # no session and no saved card survives a single run. That is the "never
      # a stored card" rule held by the browser itself rather than by anyone
      # remembering it.
      - --isolated
      # The browser's own origin allowlist, in front of the one this
      # application enforces (MCP_SERVERS_JSON -> allowed_hosts). Two layers on
      # purpose: ours refuses to *ask* for a host nobody permitted, this one
      # refuses to *fetch* one, including the subresources a page pulls in by
      # itself, which ours never sees.
      #
      # The default is a domain that cannot resolve, and that is deliberate:
      # passing an empty value here means "no origin restriction", not "no
      # origins" - measured 2026-08-29, when a navigation succeeded through an
      # empty list. Naming an unresolvable origin is the only way to say
      # "nowhere" to this flag, so the container ships able to fetch nothing
      # and an operator has to say where before it can.
      - --allowed-origins=${BROWSER_ALLOWED_ORIGINS:-https://nowhere.invalid}
      - --port=8931
      - --host=0.0.0.0
      # Not the same thing as --allowed-origins above, despite the names, and
      # the difference is worth stating because getting it backwards would be
      # silent. `--allowed-origins` is where the *browser* may go.
      # `--allowed-hosts` is who may talk *to* this server: it checks the Host
      # header, defaults to whatever the server bound to, and is what stops a
      # page in some other browser from driving this one by DNS rebinding.
      # Binding to 0.0.0.0 for the compose network means the default no longer
      # matches, so the one name siblings reach it by is named here - and only
      # that one. Never '*'.
      - --allowed-hosts=browser:8931
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Chromium crashes on Docker's default 64MB of shared memory.
    shm_size: 512m
    mem_limit: ${BROWSER_MEMORY_LIMIT:-2g}

  presentation-renderer:
    extra_hosts: *spark-hosts
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build:
      context: ./presentation-renderer
    container_name: anios_presentation_renderer
    logging: *bounded-logs
    environment:
      - PORT=8002
      - MAX_REQUEST_BYTES=62914560
      - REQUIRE_OFFICE_VALIDATION=true
    ports:
      - "8002:8002"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 10

  presentation-worker:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build: .
    container_name: anios_presentation_worker
    logging: *bounded-logs
    command:
      - python
      - -m
      - backend.workers.presentation_worker
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      # Seals free-text columns at rest. Empty disables it; every service
      # that writes a sealed column needs the same key, or one of them
      # stores plaintext into a column another reads as sealed.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - LLM_BASE_URL=http://animallya-spark1.local:8000
      - LLM_MODEL=deepseek-v4-flash
      - INFERENCE_ADAPTER=${INFERENCE_ADAPTER:-openai_compatible}
      - INFERENCE_PROVIDER_NAME=vllm
      - PRESENTATION_INFERENCE_ADAPTER=${PRESENTATION_INFERENCE_ADAPTER:-}
      - PRESENTATION_LLM_BASE_URL=http://animallya-spark1.local:8000
      - PRESENTATION_LLM_MODEL=deepseek-v4-flash
      - PRESENTATION_LLM_REASONING_EFFORT=${PRESENTATION_LLM_REASONING_EFFORT:-none}
      - IMAGE_PROVIDER_BASE_URL=${IMAGE_PROVIDER_BASE_URL:-http://host.docker.internal:8188}
      # This worker creates slide imagery through the same provider the chat
      # path uses, so it needs the same checkpoint. Without these it silently
      # fell back to the built-in defaults, and changing IMAGE_MODEL would have
      # moved chat images to a new model while leaving slides on the old one.
      - IMAGE_MODEL=${IMAGE_MODEL:-flux-2-klein-4b-fp8.safetensors}
      - IMAGE_TEXT_ENCODER=${IMAGE_TEXT_ENCODER:-qwen_3_4b.safetensors}
      - IMAGE_VAE=${IMAGE_VAE:-flux2-vae.safetensors}
      - IMAGE_GENERATION_STEPS=${IMAGE_GENERATION_STEPS:-4}
      - PRESENTATION_AUTO_IMAGE_MAX=${PRESENTATION_AUTO_IMAGE_MAX:-1}
      - PRESENTATION_AUTO_IMAGE_SIZE=${PRESENTATION_AUTO_IMAGE_SIZE:-1024}
      - ARTIFACT_STORAGE_ROOT=/app/data/artifacts
      - PRESENTATION_RENDERER_BASE_URL=http://presentation-renderer:8002
      - PRESENTATION_REQUIRE_OFFICE_VALIDATION=true
      # Slide calls read the outline, never each other, so they run together.
      - PRESENTATION_SLIDE_CONCURRENCY=${PRESENTATION_SLIDE_CONCURRENCY:-4}
      # Deck grounding runs in this process, not the API, because the durable
      # worker is what plans a deck. Without these the worker's search provider
      # is silently disabled and every figure comes from recollection again.
      - PRESENTATION_RESEARCH_ENABLED=${PRESENTATION_RESEARCH_ENABLED:-true}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - SEARCH_MONTHLY_CREDITS=${SEARCH_MONTHLY_CREDITS:-1000}
      - SEARCH_PROVIDER_NAME=${SEARCH_PROVIDER_NAME:-tavily}
      - SEARCH_MCP_SERVER_ID=${SEARCH_MCP_SERVER_ID:-internet}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - BRAVE_SEARCH_MONTHLY_LIMIT=${BRAVE_SEARCH_MONTHLY_LIMIT:-900}
      - BRAVE_SEARCH_QUOTA_DB_PATH=${BRAVE_SEARCH_QUOTA_DB_PATH:-/app/data/search/brave_search_quota.sqlite3}
      - SEARCH_PROVIDER_ORDER=${SEARCH_PROVIDER_ORDER:-brave,google,tavily}
      - SEARCH_CACHE_TTL_SECONDS=${SEARCH_CACHE_TTL_SECONDS:-1800}
      - SEARCH_CACHE_DB_PATH=/app/data/search/search_cache.sqlite3
      - SEARCH_MCP_TOOL_NAME=${SEARCH_MCP_TOOL_NAME:-search_web}
      # Declared so they reach the internet MCP subprocess too, which
      # inherits SEARCH_* from this environment and does the actual
      # searching. Raising the code default alone would not have.
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-8}
      - SEARCH_MAX_CONTENT_CHARS=${SEARCH_MAX_CONTENT_CHARS:-6000}
      - SEARCH_RESULT_CHARS=${SEARCH_RESULT_CHARS:-2500}
      - SEARCH_PAYLOAD_CHARS=${SEARCH_PAYLOAD_CHARS:-24000}
      - MCP_MAX_RESULT_CHARS=${MCP_MAX_RESULT_CHARS:-32000}
      - SEARCH_DEPTH=${SEARCH_DEPTH:-advanced}
      - SEARCH_MIN_SCORE=${SEARCH_MIN_SCORE:-0.4}
      - SEARCH_MAX_ROUNDS=${SEARCH_MAX_ROUNDS:-3}
      - SEARCH_MIN_ROUNDS=${SEARCH_MIN_ROUNDS:-2}
      - MEMORY_RECALL_TURNS_ENABLED=${MEMORY_RECALL_TURNS_ENABLED:-true}
      - MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE=${MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE:-0.45}
      - MEMORY_RECALL_TURNS_MAX_RESULTS=${MEMORY_RECALL_TURNS_MAX_RESULTS:-3}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_SEARCH_ENABLED=${GOOGLE_SEARCH_ENABLED:-false}
      - GOOGLE_SEARCH_MODEL=${GOOGLE_SEARCH_MODEL:-gemini-3.1-flash-lite}
      - GOOGLE_SEARCH_TIMEOUT_SECONDS=${GOOGLE_SEARCH_TIMEOUT_SECONDS:-30}
      - GOOGLE_SEARCH_MAX_OUTPUT_TOKENS=${GOOGLE_SEARCH_MAX_OUTPUT_TOKENS:-2048}
      - GOOGLE_SEARCH_DAILY_LIMIT=${GOOGLE_SEARCH_DAILY_LIMIT:-450}
      - GOOGLE_SEARCH_MONTHLY_LIMIT=${GOOGLE_SEARCH_MONTHLY_LIMIT:-4800}
      - GOOGLE_SEARCH_QUOTA_DB_PATH=/app/data/search/google_search_quota.sqlite3
      - MCP_SERVERS_JSON=${MCP_SERVERS_JSON:-[]}
      - PRESENTATION_JOB_POLL_SECONDS=${PRESENTATION_JOB_POLL_SECONDS:-0.5}
      - PRESENTATION_JOB_LEASE_SECONDS=${PRESENTATION_JOB_LEASE_SECONDS:-300}
      - PRESENTATION_JOB_HEARTBEAT_SECONDS=${PRESENTATION_JOB_HEARTBEAT_SECONDS:-30}
      - REDIS_URL=redis://redis:6379/0
      - MODEL_GATE_ENABLED=true
      - MODEL_GATE_LEASE_SECONDS=${MODEL_GATE_LEASE_SECONDS:-300}
      - MODEL_GATE_POLL_SECONDS=${MODEL_GATE_POLL_SECONDS:-0.1}
      # How long background work gives way before going anyway. Unbounded, this
      # is starvation rather than priority: a deck waited 7m09s on one call
      # while chat ran and the engine sat idle.
      - MODEL_GATE_MAX_WAIT_SECONDS=${MODEL_GATE_MAX_WAIT_SECONDS:-20}
    extra_hosts: *spark-hosts
    volumes:
      # The ONNX weights: the image embedder and the discovery cross-encoder.
      # data/ is in .dockerignore so they are not in the image, and both
      # providers disable themselves when their file is absent rather than
      # raising - so a missing mount reads as "that feature is off" with
      # nothing logged. Read-only; nothing should ever write here.
      - ./data/models:/app/data/models:ro
      - artifactdata:/app/data/artifacts
      # The Google research quota counter is shared with the API, so both
      # processes reserve against one count rather than two.
      - searchdata:/app/data/search
    depends_on:
      db:
        condition: service_healthy
      presentation-renderer:
        condition: service_healthy
      redis:
        condition: service_started

  # The ambient discovery loop. Separate from the presentation worker because
  # the two have nothing in common but the leasing pattern: this one reads
  # feeds and embeddings, never the generation model, so it must not wait on
  # the generation service to be healthy before it can run.
  discovery-worker:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build: .
    container_name: anios_discovery_worker
    logging: *bounded-logs
    command:
      - python
      - -m
      - backend.workers.discovery_worker
    environment:
      # Otherwise nothing this worker logs is visible until its stdout buffer
      # fills, which for a loop that sleeps between sweeps is effectively never.
      # The API appears to log fine without this only because uvicorn configures
      # its own handlers; a plain `python -m` process does not, so a whole
      # sweep's worth of evidence sat unflushed in a container reporting healthy.
      - PYTHONUNBUFFERED=1
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      # The worker writes sealed columns (a seen item's title), so it needs
      # the same key as the API — otherwise it stores plaintext into a column
      # the API reads as sealed.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - INFERENCE_ADAPTER=${INFERENCE_ADAPTER:-openai_compatible}
      - INFERENCE_PROVIDER_NAME=vllm
      - EMBEDDING_BASE_URL=http://vllm-embedding:8000
      # Scout's cascade has two halves: an embedding shortlist and a
      # cross-encoder that reads each pair. The second was silently off in
      # this worker - the service that actually runs the sweeps - because
      # only the backend and two others were handed the endpoint, and
      # PrecisionRanker treats a missing URL as absence and keeps the
      # embedding order (2026-09-03).
      - RERANKER_BASE_URL=${RERANKER_BASE_URL:-}
      - RERANKER_MODEL=${RERANKER_MODEL:-qwen3-reranker-0.6b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-nomic-embed-text-v1.5}
      # Egress stays off unless the operator turns it on deliberately.
      - DISCOVERY_EGRESS_ENABLED=${DISCOVERY_EGRESS_ENABLED:-false}
      - DISCOVERY_IMESSAGE_SERVER_ID=${DISCOVERY_IMESSAGE_SERVER_ID:-imessage}
      - DISCOVERY_IMESSAGE_TOOL=${DISCOVERY_IMESSAGE_TOOL:-send_imessage}
      # The conversation over iMessage: the worker polls the bridge for
      # inbound texts and answers them through the backend's own /chat.
      - IMESSAGE_CHAT_ENABLED=${IMESSAGE_CHAT_ENABLED:-false}
      - IMESSAGE_CHAT_POLL_SECONDS=${IMESSAGE_CHAT_POLL_SECONDS:-5}
      - IMESSAGE_CHAT_READ_TOOL=${IMESSAGE_CHAT_READ_TOOL:-read_messages}
      - IMESSAGE_CHAT_BASE_URL=${IMESSAGE_CHAT_BASE_URL:-http://backend:8000}
      - DISCOVERY_CALENDAR_BASE_URL=${DISCOVERY_CALENDAR_BASE_URL:-http://localhost:8000/api/v1/discovery}
      - DISCOVERY_POLL_SECONDS=${DISCOVERY_POLL_SECONDS:-60}
      - DISCOVERY_RUN_LEASE_SECONDS=${DISCOVERY_RUN_LEASE_SECONDS:-300}
      - DISCOVERY_RUN_HEARTBEAT_SECONDS=${DISCOVERY_RUN_HEARTBEAT_SECONDS:-60}
      - DISCOVERY_PLACE_RESOLVER=${DISCOVERY_PLACE_RESOLVER:-}
      - DISCOVERY_PLACE_RESOLVER_URL=${DISCOVERY_PLACE_RESOLVER_URL:-https://nominatim.openstreetmap.org/reverse}
      - DISCOVERY_PLACE_RESOLVER_USER_AGENT=${DISCOVERY_PLACE_RESOLVER_USER_AGENT:-AniOS/1.0 (local personal assistant)}
      # Must match the backend's value: the two share one pool, so a
      # disagreement means each enforces a different ceiling on it.
      - SEARCH_MONTHLY_CREDITS=${SEARCH_MONTHLY_CREDITS:-1000}
      - MCP_SERVERS_JSON=${MCP_SERVERS_JSON:-[]}
      # Without these the sweep has no search provider, and a profile with no
      # feeds then reads zero events and finds nothing — every week, silently,
      # while the same account finds things through the API because the backend
      # container does have them. The credits line above was here on its own,
      # which made it look like search was already wired up.
      - SEARCH_PROVIDER_NAME=${SEARCH_PROVIDER_NAME:-tavily}
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - SEARCH_MCP_SERVER_ID=${SEARCH_MCP_SERVER_ID:-internet}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - BRAVE_SEARCH_MONTHLY_LIMIT=${BRAVE_SEARCH_MONTHLY_LIMIT:-900}
      - BRAVE_SEARCH_QUOTA_DB_PATH=${BRAVE_SEARCH_QUOTA_DB_PATH:-/app/data/search/brave_search_quota.sqlite3}
      - SEARCH_PROVIDER_ORDER=${SEARCH_PROVIDER_ORDER:-brave,google,tavily}
      - SEARCH_CACHE_TTL_SECONDS=${SEARCH_CACHE_TTL_SECONDS:-1800}
      - SEARCH_CACHE_DB_PATH=/app/data/search/search_cache.sqlite3
      - SEARCH_MCP_TOOL_NAME=${SEARCH_MCP_TOOL_NAME:-search_web}
      # Declared so they reach the internet MCP subprocess too, which
      # inherits SEARCH_* from this environment and does the actual
      # searching. Raising the code default alone would not have.
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-8}
      - SEARCH_MAX_CONTENT_CHARS=${SEARCH_MAX_CONTENT_CHARS:-6000}
      - SEARCH_RESULT_CHARS=${SEARCH_RESULT_CHARS:-2500}
      - SEARCH_PAYLOAD_CHARS=${SEARCH_PAYLOAD_CHARS:-24000}
      - MCP_MAX_RESULT_CHARS=${MCP_MAX_RESULT_CHARS:-32000}
      - SEARCH_DEPTH=${SEARCH_DEPTH:-advanced}
      - SEARCH_MIN_SCORE=${SEARCH_MIN_SCORE:-0.4}
      - SEARCH_MAX_ROUNDS=${SEARCH_MAX_ROUNDS:-3}
      - SEARCH_MIN_ROUNDS=${SEARCH_MIN_ROUNDS:-2}
      - MEMORY_RECALL_TURNS_ENABLED=${MEMORY_RECALL_TURNS_ENABLED:-true}
      - MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE=${MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE:-0.45}
      - MEMORY_RECALL_TURNS_MAX_RESULTS=${MEMORY_RECALL_TURNS_MAX_RESULTS:-3}
      - DISCOVERY_WEB_SEARCH_ENABLED=${DISCOVERY_WEB_SEARCH_ENABLED:-true}
      # Off means every sweep reports everything it finds, including what it
      # has shown before. Useful while judging output; not what you want on a
      # schedule.
      - DISCOVERY_NOVELTY_ENABLED=${DISCOVERY_NOVELTY_ENABLED:-true}
      - DISCOVERY_WEB_QUERIES_PER_SWEEP=${DISCOVERY_WEB_QUERIES_PER_SWEEP:-4}
      # Whether a sweep aims its queries and its ranking at the person using
      # approved memory, or searches the bare interest label as it always did.
      # Both must match the backend's values: the API runs rehearsals, and a
      # rehearsal that aims differently from the scheduled run is not a
      # rehearsal of anything.
      - DISCOVERY_PERSONAL_QUERIES_ENABLED=${DISCOVERY_PERSONAL_QUERIES_ENABLED:-true}
      - DISCOVERY_MEMORY_RERANK_ENABLED=${DISCOVERY_MEMORY_RERANK_ENABLED:-true}
      # The cross-encoder that orders the shortlist. It runs in-process on CPU
      # from weights baked into the image, so this switch is the only thing
      # either service needs; both must agree, or a rehearsal orders finds
      # differently from the scheduled sweep that follows it.
      - DISCOVERY_CROSS_ENCODER_ENABLED=${DISCOVERY_CROSS_ENCODER_ENABLED:-true}
      - DISCOVERY_RERANKER_SOURCE=${DISCOVERY_RERANKER_SOURCE:-local}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_SEARCH_ENABLED=${GOOGLE_SEARCH_ENABLED:-false}
      - GOOGLE_SEARCH_MODEL=${GOOGLE_SEARCH_MODEL:-gemini-3.1-flash-lite}
      - GOOGLE_SEARCH_DAILY_LIMIT=${GOOGLE_SEARCH_DAILY_LIMIT:-450}
      - GOOGLE_SEARCH_MONTHLY_LIMIT=${GOOGLE_SEARCH_MONTHLY_LIMIT:-4800}
      - GOOGLE_SEARCH_QUOTA_DB_PATH=/app/data/search/google_search_quota.sqlite3
      # The sweep writes each find's description with the model, falling back to
      # a first-sentence extract when it cannot. Undeclared, LLM_BASE_URL
      # defaults to 127.0.0.1:8003 — the host's address, which inside this
      # container is nothing — so the call always failed and every digest
      # silently used the fallback. The failure is invisible by design, because
      # falling back is the correct behaviour when the model is genuinely down.
      - LLM_BASE_URL=http://animallya-spark1.local:8000
      - LLM_MODEL=deepseek-v4-flash
      - MAIN_LLM_BASE_URL=http://animallya-spark1.local:8000
      - MAIN_LLM_MODEL=deepseek-v4-flash
      # A turn may take more than one bookkeeping step. Ships at 1, so the
      # loop is unreachable until this is raised. iMessage turns run in
      # discovery-worker, so leaving it out here would flip the setting for
      # the web and not for the channel most people actually use.
      - TURN_MAX_STEPS=${TURN_MAX_STEPS:-1}
      - TURN_STEP_BUDGET_SECONDS=${TURN_STEP_BUDGET_SECONDS:-45}
      # Empty rather than DeepSeek's date: a wrong cutoff is worse than
      # none, because the model would trust everything before it.
      - MAIN_LLM_TRAINING_CUTOFF=${QWEN_TRAINING_CUTOFF:-}
      - INFERENCE_ADAPTER=${INFERENCE_ADAPTER:-openai_compatible}
      # Same shape of mistake: the default is a loopback address that resolves
      # to this container rather than to the shared Redis.
      - REDIS_URL=redis://redis:6379/0
    extra_hosts: *spark-hosts
    volumes:
      # The image embedder's weights, 374 MB of ONNX. data/ is in
      # .dockerignore so they are not in the image, and NomicVisionEmbedding
      # Provider disables itself when the file is absent rather than raising -
      # so a missing mount reads as "image search is off" with nothing logged.
      # Read-only: nothing should ever write here.
      - ./data/models:/app/data/models:ro
      # The Google quota counter is shared with the API so both reserve against
      # one count rather than two.
      - searchdata:/app/data/search
    depends_on:
      db:
        condition: service_healthy
      vllm-embedding:
        condition: service_healthy
      browser:
        condition: service_started
    # iMessage turns run here, so this is the service that actually invokes a
    # browser tool for the operator. On the default network like every sibling,
    # and additionally on the browser's own.
    networks:
      - default
      - browser

  backend:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build: .
    container_name: anios_backend
    logging: *bounded-logs
    ports:
      # The host port is a variable because on a DGX Spark port 8000 is the
      # vLLM head. Inside the compose network this is always :8000, so the
      # gateway and every sibling are unaffected by whatever the host maps.
      - "${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      # Credentials come from .env; the container-only values below stay literal
      # because .env holds host-oriented ones (POSTGRES_HOST=localhost).
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      # No default: a missing secret must fail the run, never fall back to a
      # committed placeholder that would sign real auth tokens.
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-true}
      - AUTH_LOCAL_USER_ID=${AUTH_LOCAL_USER_ID:-ani.mallya}
      - AUTH_SESSION_TTL_HOURS=${AUTH_SESSION_TTL_HOURS:-168}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_SAMESITE=${AUTH_COOKIE_SAMESITE:-lax}
      - AUTH_TRUSTED_ORIGINS=${AUTH_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      - AUTH_LOGIN_MAX_FAILURES=${AUTH_LOGIN_MAX_FAILURES:-8}
      - AUTH_LOGIN_FAILURE_WINDOW_SECONDS=${AUTH_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      - AUTH_LOGIN_GLOBAL_MAX_ATTEMPTS=${AUTH_LOGIN_GLOBAL_MAX_ATTEMPTS:-120}
      - AUTH_LOGIN_GLOBAL_WINDOW_SECONDS=${AUTH_LOGIN_GLOBAL_WINDOW_SECONDS:-60}
      # Seals free-text columns at rest. Empty disables it; every service
      # that writes a sealed column needs the same key, or one of them
      # stores plaintext into a column another reads as sealed.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # Reverse geocoding for the Agents tab location button. Empty disables
      # it; typing a town needs nothing here.
      - DISCOVERY_PLACE_RESOLVER=${DISCOVERY_PLACE_RESOLVER:-}
      - DISCOVERY_PLACE_RESOLVER_URL=${DISCOVERY_PLACE_RESOLVER_URL:-https://nominatim.openstreetmap.org/reverse}
      - DISCOVERY_PLACE_RESOLVER_USER_AGENT=${DISCOVERY_PLACE_RESOLVER_USER_AGENT:-AniOS/1.0 (local personal assistant)}
      - DISCOVERY_EGRESS_ENABLED=${DISCOVERY_EGRESS_ENABLED:-false}
      # Must match the worker's value: the API can run a sweep too, and the
      # two disagreeing means a rehearsal and a real run filter differently.
      - DISCOVERY_NOVELTY_ENABLED=${DISCOVERY_NOVELTY_ENABLED:-true}
      # Must match the worker's values for the same reason: a rehearsal run
      # from here has to aim its queries and its ranking exactly as the
      # scheduled sweep will.
      - DISCOVERY_PERSONAL_QUERIES_ENABLED=${DISCOVERY_PERSONAL_QUERIES_ENABLED:-true}
      - DISCOVERY_MEMORY_RERANK_ENABLED=${DISCOVERY_MEMORY_RERANK_ENABLED:-true}
      # The cross-encoder that orders the shortlist. It runs in-process on CPU
      # from weights baked into the image, so this switch is the only thing
      # either service needs; both must agree, or a rehearsal orders finds
      # differently from the scheduled sweep that follows it.
      - DISCOVERY_CROSS_ENCODER_ENABLED=${DISCOVERY_CROSS_ENCODER_ENABLED:-true}
      - DISCOVERY_RERANKER_SOURCE=${DISCOVERY_RERANKER_SOURCE:-local}
      # Which server owns the Apple device, and what its send tool is called.
      # The worker had these and this did not, so a send from the API would
      # resolve the tool name to its code default - `send_message`, which the
      # bridge does not expose - and fail as a withdrawn tool, with nothing
      # pointing at the missing key.
      - DISCOVERY_IMESSAGE_SERVER_ID=${DISCOVERY_IMESSAGE_SERVER_ID:-imessage}
      - DISCOVERY_IMESSAGE_TOOL=${DISCOVERY_IMESSAGE_TOOL:-send_imessage}
      - DISCOVERY_CALENDAR_BASE_URL=${DISCOVERY_CALENDAR_BASE_URL:-http://localhost:8000/api/v1/discovery}
      # vLLM runs as pinned sibling services with independent generation and
      # embedding endpoints.
      - LLM_BASE_URL=http://animallya-spark1.local:8000
      - LLM_MODEL=deepseek-v4-flash
      - INFERENCE_ADAPTER=${INFERENCE_ADAPTER:-openai_compatible}
      - INFERENCE_PROVIDER_NAME=vllm
      # Conversational replies only (build_assistant_graph / stream_chat).
      # DeepSeek-V4-Flash beat Qwen and Nemotron on every category of a
      # blind 6-prompt evaluation (2026-08-14) and never failed to answer,
      # unlike Nemotron (hard-failed 2/6, blew its token budget on hidden
      # reasoning) and unlike Qwen itself, which never finished the
      # multi-step word problem. Cost: ~5x Qwen's total reply time
      # (~32s vs ~6s avg), accepted as the intelligence/speed tradeoff.
      - MAIN_INFERENCE_ADAPTER=${MAIN_INFERENCE_ADAPTER:-}
      - MAIN_LLM_BASE_URL=${MAIN_LLM_BASE_URL:-http://animallya-spark1.local:8000}
      - MAIN_LLM_MODEL=${MAIN_LLM_MODEL:-deepseek-v4-flash}
      # Belongs with the model above, not with the deployment: it states
      # which of that model's beliefs are already stale, and the gap
      # between it and today is what a web search is for. Change it when
      # the model changes. DeepSeek does not publish cutoffs; this is the
      # measured value: it names Qwen2.5 as the newest Qwen it knows and
      # believes the year is 2024.
      - MAIN_LLM_TRAINING_CUTOFF=${MAIN_LLM_TRAINING_CUTOFF:-2024-07}
      # Sized from measurement: at the old 1,024 one reply in six came back
      # empty, because the model spends part of the budget on thinking that
      # is never rendered and the stream then carries no content at all.
      - MAIN_LLM_MAX_TOKENS=${MAIN_LLM_MAX_TOKENS:-4096}
      # Measure what a turn costs; do not act on it yet. Enforcement stays
      # off until the section priorities have been argued against real turn
      # sizes rather than assumed.
      - CONTEXT_BUDGET_ENABLED=${CONTEXT_BUDGET_ENABLED:-true}
      - CONTEXT_BUDGET_ENFORCE=${CONTEXT_BUDGET_ENFORCE:-false}
      - CONTEXT_BUDGET_TOKENS=${CONTEXT_BUDGET_TOKENS:-32768}
      # This turn's volatile blocks go after the history, so the prefix above
      # them stays byte-identical and the server reuses its KV cache.
      # Measured on the reply model: 16.3s -> 2.0s on a second turn.
      - CONTEXT_CACHE_ORDERING=${CONTEXT_CACHE_ORDERING:-true}
      # The conversation digest is written by the reply model, falling back
      # to bounded truncation whenever that fails. Runs once per interval,
      # after the reply is sent, so it never delays an answer.
      - MEMORY_DIGEST_MODEL_ENABLED=${MEMORY_DIGEST_MODEL_ENABLED:-true}
      - MEMORY_DIGEST_MAX_WORDS=${MEMORY_DIGEST_MAX_WORDS:-200}
      - MEMORY_DIGEST_MAX_TOKENS=${MEMORY_DIGEST_MAX_TOKENS:-2048}
      - MAIN_LLM_REASONING_EFFORT=${MAIN_LLM_REASONING_EFFORT:-none}
      # Routing runs on the main model. It used to be pinned to a 4B purely
      # because that model enforced JSON grammars and the old engine ignored
      # them; vLLM enforces schemas, so the pin lost its reason and the 4B is
      # gone. These stay spelled out rather than inheriting MAIN_LLM_* so that
      # moving one role to a different box stays a one-line change.
      # One decision per turn was a ceiling on what a request could express,
      # not a design. Ships at 1 so the loop is unreachable; raising it is an
      # env change and a restart, never a rebuild.
      - TURN_MAX_STEPS=${TURN_MAX_STEPS:-1}
      - TURN_STEP_BUDGET_SECONDS=${TURN_STEP_BUDGET_SECONDS:-45}
      - ROUTING_INFERENCE_ADAPTER=${ROUTING_INFERENCE_ADAPTER:-}
      - ROUTING_LLM_BASE_URL=http://animallya-spark1.local:8000
      - ROUTING_LLM_MODEL=deepseek-v4-flash
      - ROUTING_LLM_REASONING_EFFORT=${ROUTING_LLM_REASONING_EFFORT:-none}
      - PRESENTATION_INFERENCE_ADAPTER=${PRESENTATION_INFERENCE_ADAPTER:-}
      - PRESENTATION_LLM_BASE_URL=http://animallya-spark1.local:8000
      - PRESENTATION_LLM_MODEL=deepseek-v4-flash
      - PRESENTATION_LLM_REASONING_EFFORT=${PRESENTATION_LLM_REASONING_EFFORT:-none}
      - DIAGRAM_INFERENCE_ADAPTER=${DIAGRAM_INFERENCE_ADAPTER:-}
      - DIAGRAM_LLM_BASE_URL=http://animallya-spark1.local:8000
      - DIAGRAM_LLM_MODEL=deepseek-v4-flash
      - DIAGRAM_LLM_REASONING_EFFORT=${DIAGRAM_LLM_REASONING_EFFORT:-none}
      - MEMORY_PROPOSAL_INFERENCE_ADAPTER=${MEMORY_PROPOSAL_INFERENCE_ADAPTER:-openai_compatible}
      - MEMORY_PROPOSAL_LLM_BASE_URL=http://animallya-spark1.local:8000
      - MEMORY_PROPOSAL_LLM_MODEL=deepseek-v4-flash
      - MEMORY_PROPOSAL_LLM_REASONING_EFFORT=${MEMORY_PROPOSAL_LLM_REASONING_EFFORT:-none}
      - MEMORY_PROPOSAL_MAX_TOKENS=${MEMORY_PROPOSAL_MAX_TOKENS:-1024}
      - VISION_INFERENCE_ADAPTER=${VISION_INFERENCE_ADAPTER:-}
      - VISION_LLM_BASE_URL=http://animallya-spark2.local:8001
      - VISION_MODEL=qwen3-vl-8b
      - VISION_LLM_REASONING_EFFORT=${VISION_LLM_REASONING_EFFORT:-none}
      # Not previously passed at all, so the one number that decides whether
      # an upload's structured inspection fits could not be changed without
      # a rebuild.
      - VISION_MAX_TOKENS=${VISION_MAX_TOKENS:-1536}
      - VISION_ESCALATION_LLM_BASE_URL=${VISION_ESCALATION_LLM_BASE_URL:-}
      - VISION_ESCALATION_MODEL=${VISION_ESCALATION_MODEL:-}
      - VISION_ESCALATION_LLM_REASONING_EFFORT=${VISION_ESCALATION_LLM_REASONING_EFFORT:-none}
      - EMBEDDING_INFERENCE_ADAPTER=${EMBEDDING_INFERENCE_ADAPTER:-}
      - EMBEDDING_BASE_URL=http://vllm-embedding:8000
      # Document parsing (docs/DOCUMENT_KNOWLEDGE_ARCHITECTURE.md): Docling on the
      # desktop GPU. Empty keeps document uploads switched off with a clear
      # message; set DOCLING_BASE_URL in .env to turn them on.
      - DOCLING_BASE_URL=${DOCLING_BASE_URL:-}
      - GOTENBERG_BASE_URL=${GOTENBERG_BASE_URL:-}
      - DOCLING_PICTURE_API_URL=${DOCLING_PICTURE_API_URL:-}
      - ANIOS_TRACE_PROMPTS=${ANIOS_TRACE_PROMPTS:-}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID:-}
      - EMBEDDING_MODEL=text-embedding-nomic-embed-text-v1.5
      # The reranker rides beside the embedder: it re-scores what the vector
      # search retrieved. It was wired into the test container only for a
      # day (2026-08-25) and fail-soft hid that the live stage was off.
      - RERANKER_BASE_URL=${RERANKER_BASE_URL:-}
      - RERANKER_MODEL=${RERANKER_MODEL:-qwen3-reranker-0.6b}
      # Points at the host ComfyUI install (E:/AI/ComfyUI), started with
      # --listen 0.0.0.0 so the container can reach it. To use the sibling
      # `comfyui` service instead, run `--profile comfyui` and set this to
      # http://comfyui:8188 (that GPU image build needs ~10-20 GB free on C:).
      - IMAGE_PROVIDER_BASE_URL=${IMAGE_PROVIDER_BASE_URL:-http://host.docker.internal:8188}
      # One FLUX.2 Klein checkpoint serves generation and editing alike, so
      # the model, text encoder and VAE are shared rather than per-role. The
      # 9B pair is the deployment's choice since 2026-08-25 (hosted on the
      # desktop's 16 GB card, which fits it at fp8); the encoder must be the
      # 8B one - the 4B encoder loads and produces garbage silently.
      - IMAGE_MODEL=${IMAGE_MODEL:-flux-2-klein-9b-fp8.safetensors}
      - IMAGE_TEXT_ENCODER=${IMAGE_TEXT_ENCODER:-qwen_3_8b_fp8mixed.safetensors}
      - IMAGE_VAE=${IMAGE_VAE:-flux2-vae.safetensors}
      # The distilled model is a four-step sampler in both directions.
      - IMAGE_GENERATION_STEPS=${IMAGE_GENERATION_STEPS:-4}
      - IMAGE_EDIT_STEPS=${IMAGE_EDIT_STEPS:-4}
      # How much of the source survives into the edit, and how it is
      # resampled. Both were ComfyUI template defaults; `nearest-exact`
      # stipples any photograph, and the megapixel budget is the ceiling
      # on what comes back, because the output is generated at that size.
      - IMAGE_EDIT_MEGAPIXELS=${IMAGE_EDIT_MEGAPIXELS:-1.0}
      - IMAGE_EDIT_SCALE_METHOD=${IMAGE_EDIT_SCALE_METHOD:-lanczos}
      - IMAGE_EDIT_MODEL=${IMAGE_EDIT_MODEL:-}
      - IMAGE_EDIT_CLIP=${IMAGE_EDIT_CLIP:-clip_l.safetensors}
      - IMAGE_EDIT_T5=${IMAGE_EDIT_T5:-t5xxl_fp8_e4m3fn_scaled.safetensors}
      - IMAGE_EDIT_VAE=${IMAGE_EDIT_VAE:-ae.safetensors}
      - IMAGE_EDIT_KONTEXT_STEPS=${IMAGE_EDIT_KONTEXT_STEPS:-20}
      - IMAGE_EDIT_GUIDANCE=${IMAGE_EDIT_GUIDANCE:-2.5}
      - ARTIFACT_STORAGE_ROOT=/app/data/artifacts
      - PRESENTATION_RENDERER_BASE_URL=http://presentation-renderer:8002
      - PRESENTATION_REQUIRE_OFFICE_VALIDATION=true
      # Slide calls read the outline, never each other, so they run together.
      - PRESENTATION_SLIDE_CONCURRENCY=${PRESENTATION_SLIDE_CONCURRENCY:-4}
      - PRESENTATION_RESEARCH_ENABLED=${PRESENTATION_RESEARCH_ENABLED:-true}
      # Opt-in web search. Empty disables it: routing still runs and logs its
      # decision, but no query is ever sent.
      - SEARCH_API_KEY=${SEARCH_API_KEY:-}
      - SEARCH_MONTHLY_CREDITS=${SEARCH_MONTHLY_CREDITS:-1000}
      - SEARCH_PROVIDER_NAME=${SEARCH_PROVIDER_NAME:-tavily}
      - SEARCH_MCP_SERVER_ID=${SEARCH_MCP_SERVER_ID:-internet}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - BRAVE_SEARCH_MONTHLY_LIMIT=${BRAVE_SEARCH_MONTHLY_LIMIT:-900}
      - BRAVE_SEARCH_QUOTA_DB_PATH=${BRAVE_SEARCH_QUOTA_DB_PATH:-/app/data/search/brave_search_quota.sqlite3}
      - SEARCH_PROVIDER_ORDER=${SEARCH_PROVIDER_ORDER:-brave,google,tavily}
      - SEARCH_CACHE_TTL_SECONDS=${SEARCH_CACHE_TTL_SECONDS:-1800}
      - SEARCH_CACHE_DB_PATH=/app/data/search/search_cache.sqlite3
      - SEARCH_MCP_TOOL_NAME=${SEARCH_MCP_TOOL_NAME:-search_web}
      # Declared so they reach the internet MCP subprocess too, which
      # inherits SEARCH_* from this environment and does the actual
      # searching. Raising the code default alone would not have.
      - SEARCH_MAX_RESULTS=${SEARCH_MAX_RESULTS:-8}
      - SEARCH_MAX_CONTENT_CHARS=${SEARCH_MAX_CONTENT_CHARS:-6000}
      - SEARCH_RESULT_CHARS=${SEARCH_RESULT_CHARS:-2500}
      - SEARCH_PAYLOAD_CHARS=${SEARCH_PAYLOAD_CHARS:-24000}
      - MCP_MAX_RESULT_CHARS=${MCP_MAX_RESULT_CHARS:-32000}
      - SEARCH_DEPTH=${SEARCH_DEPTH:-advanced}
      - SEARCH_MIN_SCORE=${SEARCH_MIN_SCORE:-0.4}
      - SEARCH_MAX_ROUNDS=${SEARCH_MAX_ROUNDS:-3}
      - SEARCH_MIN_ROUNDS=${SEARCH_MIN_ROUNDS:-2}
      - MEMORY_RECALL_TURNS_ENABLED=${MEMORY_RECALL_TURNS_ENABLED:-true}
      - MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE=${MEMORY_RECALL_TURNS_MAX_COSINE_DISTANCE:-0.45}
      - MEMORY_RECALL_TURNS_MAX_RESULTS=${MEMORY_RECALL_TURNS_MAX_RESULTS:-3}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_SEARCH_ENABLED=${GOOGLE_SEARCH_ENABLED:-false}
      - GOOGLE_SEARCH_MODEL=${GOOGLE_SEARCH_MODEL:-gemini-3.1-flash-lite}
      - GOOGLE_SEARCH_TIMEOUT_SECONDS=${GOOGLE_SEARCH_TIMEOUT_SECONDS:-30}
      - GOOGLE_SEARCH_MAX_OUTPUT_TOKENS=${GOOGLE_SEARCH_MAX_OUTPUT_TOKENS:-2048}
      - GOOGLE_SEARCH_DAILY_LIMIT=${GOOGLE_SEARCH_DAILY_LIMIT:-450}
      - GOOGLE_SEARCH_MONTHLY_LIMIT=${GOOGLE_SEARCH_MONTHLY_LIMIT:-4800}
      - GOOGLE_SEARCH_QUOTA_DB_PATH=/app/data/search/google_search_quota.sqlite3
      - MCP_SERVERS_JSON=${MCP_SERVERS_JSON:-[]}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER=${OTEL_EXPORTER:-console}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - REDIS_URL=redis://redis:6379/0
      - MODEL_GATE_ENABLED=true
      - MODEL_GATE_LEASE_SECONDS=${MODEL_GATE_LEASE_SECONDS:-300}
      - MODEL_GATE_POLL_SECONDS=${MODEL_GATE_POLL_SECONDS:-0.1}
      # How long background work gives way before going anyway. Unbounded, this
      # is starvation rather than priority: a deck waited 7m09s on one call
      # while chat ran and the engine sat idle.
      - MODEL_GATE_MAX_WAIT_SECONDS=${MODEL_GATE_MAX_WAIT_SECONDS:-20}
    extra_hosts: *spark-hosts
    volumes:
      # The image embedder's weights, 374 MB of ONNX. data/ is in
      # .dockerignore so they are not in the image, and NomicVisionEmbedding
      # Provider disables itself when the file is absent rather than raising -
      # so a missing mount reads as "image search is off" with nothing logged.
      # Read-only: nothing should ever write here.
      - ./data/models:/app/data/models:ro
      - artifactdata:/app/data/artifacts
      - searchdata:/app/data/search
      # Context measurements accumulate across rebuilds here; docker logs do
      # not survive them, and enforcement floors need days of distribution.
      - telemetrydata:/app/data/telemetry
    depends_on:
      vllm-embedding:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_started
      local-capabilities:
        condition: service_started
      presentation-renderer:
        condition: service_healthy
      presentation-worker:
        condition: service_started
      browser:
        condition: service_started
    # On the default network like every sibling, and additionally on the
    # browser's own, which is the only way to reach it.
    networks:
      - default
      - browser

  frontend:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: anios_frontend
    logging: *bounded-logs
    ports:
      - "5173:5173"
    environment:
      # Poll the bind-mounted source so hot reload fires across the Docker mount.
      - VITE_USE_POLLING=true
    volumes:
      - ./frontend:/app
      # Keep the image's installed node_modules instead of the host's (if any).
      - /app/node_modules
    depends_on:
      - backend

  cloudflared:
    # The public origin for deep-matter.com. This used to be a hand-started
    # cloudflared.exe on the Windows desktop, which meant the site was only up
    # while that machine was awake and someone had run it. Running it beside
    # the gateway ties the tunnel's life to the stack's.
    #
    # It joins the compose network and targets `gateway:8080` directly, so the
    # gateway no longer has to publish a host port at all for ingress to work.
    restart: unless-stopped
    image: cloudflare/cloudflared:latest
    container_name: anios_cloudflared
    logging: *bounded-logs
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./secrets/cloudflared:/etc/cloudflared:ro
    depends_on:
      - gateway
    profiles:
      - tunnel

  gateway:
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile.gateway
    container_name: anios_gateway
    logging: *bounded-logs
    # The tunnel targets one loopback-only port; no LAN or public socket is
    # opened, so ingress cannot reach anything the gateway does not serve.
    #
    # Both loopback families, because "localhost" does not mean one address. The
    # tunnel running as a Windows service resolved it to ::1, found nothing
    # listening, and answered every public request with 502 while the same URL
    # worked from a user shell over 127.0.0.1. Binding both makes the origin
    # reachable however the resolver happens to order them, and neither is
    # reachable from outside this machine.
    ports:
      - "127.0.0.1:${ANIOS_GATEWAY_PORT:-8080}:8080"
      - "[::1]:${ANIOS_GATEWAY_PORT:-8080}:8080"
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 5s
      timeout: 3s
      retries: 12


  comfyui:
    build:
      context: ./docker/comfyui
      # Dockerfile is the RTX-50-series (sm_120, x86) image; Dockerfile.gb10 is
      # the DGX Spark one (sm_121, aarch64, CUDA 13). Select per host in .env.
      dockerfile: ${COMFYUI_DOCKERFILE:-Dockerfile}
    container_name: anios_comfyui
    logging: *bounded-logs
    # Comes back when Docker does, like every other service here. This was the
    # one that never got the line, which is exactly how it behaved: the whole
    # stack returned after a reboot and image generation alone did not, with
    # every container reporting healthy while every picture failed. `profiles`
    # gates `up`, not restart -- once this container exists the daemon brings it
    # back on its own.
    restart: unless-stopped
    # Opt-in: heavy GPU image build. Start with `docker compose --profile comfyui up`.
    profiles: ["comfyui"]
    ports:
      - "8188:8188"
    volumes:
      # Bind-mount your existing ComfyUI install (code, custom nodes, and models).
      - ${COMFYUI_HOST_PATH:-E:/AI/ComfyUI}:/comfyui
    # `/` answers 200 from a ComfyUI whose CUDA context has died, so liveness is
    # read from the endpoint that actually exercises the device. Docker will not
    # restart on this by itself, but it makes the failure visible in `docker ps`
    # instead of only in a user's failed image request.
    # python3 rather than curl: this image ships neither curl nor wget, and a
    # probe that cannot run reports the service unhealthy for the wrong reason.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import sys, urllib.request
          try:
              r = urllib.request.urlopen(
                  "http://localhost:8188/system_stats", timeout=8
              )
          except Exception:
              sys.exit(1)
          sys.exit(0 if r.status == 200 else 1)
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  memory-maintenance:
    volumes:
      # The ONNX weights: the image embedder and the discovery cross-encoder.
      # data/ is in .dockerignore so they are not in the image, and both
      # providers disable themselves when their file is absent rather than
      # raising - so a missing mount reads as "that feature is off" with
      # nothing logged. Read-only; nothing should ever write here.
      - ./data/models:/app/data/models:ro
    # Comes back when Docker does, so a reboot does not
    # need someone to remember to start it.
    restart: unless-stopped
    build: .
    profiles: ["maintenance"]
    command:
      - python
      - -m
      - backend.cli.run_memory_maintenance
      - --all-users
      - --strict
      - --interval-seconds
      - "3600"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
    depends_on:
      db:
        condition: service_healthy

  storage-collection:
    # Deleting a row and deleting its bytes cannot be one atomic act across a
    # database and a filesystem, so a leak stays possible however carefully
    # each call site deletes. One sweep found 460 MB of 556 MB unreachable.
    # This bounds that in time rather than letting it accumulate forever.
    #
    # The grace period is a day, far longer than the gap between a render
    # writing its bytes and recording its row, because the cost of waiting is a
    # delayed sweep and the cost of being wrong is someone's deck.
    restart: unless-stopped
    build: .
    profiles: ["maintenance"]
    command:
      - python
      - -m
      - backend.cli.collect_storage
      - --apply
      - --grace-seconds
      - "86400"
      - --interval-seconds
      - "21600"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-anios_db}
      - POSTGRES_HOST=db
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env (see .env.example)}
      - ARTIFACT_STORAGE_ROOT=/app/data/artifacts
    volumes:
      # The ONNX weights: the image embedder and the discovery cross-encoder.
      # data/ is in .dockerignore so they are not in the image, and both
      # providers disable themselves when their file is absent rather than
      # raising - so a missing mount reads as "that feature is off" with
      # nothing logged. Read-only; nothing should ever write here.
      - ./data/models:/app/data/models:ro
      - artifactdata:/app/data/artifacts
    depends_on:
      db:
        condition: service_healthy

networks:
  # Only `browser` and the two services that invoke tools sit on this one,
  # so the container running third-party code that fetches the open web has
  # no route to Postgres, Redis or the inference servers.
  browser:
    driver: bridge

volumes:
  redisdata:
  pgdata:
  # WAL segments and base backups for point-in-time recovery; the db
  # container archives into it and backup-db.sh copies it out and mirrors it.
  walarchive:
  artifactdata:
  searchdata:
  telemetrydata:
