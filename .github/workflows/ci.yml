name: CI

# Static checks only. There is deliberately no test step here.
#
# It used to run `pytest tests/` - a directory that has never existed in this
# repository (tests are under backend/tests/) - and it never installed
# pytest-asyncio, so it had been silently proving nothing since the initial
# commit. Repairing it is not possible in the way that matters: the tests worth
# gating on send real prompts to the models, and a GitHub runner cannot reach
# animallya-spark1.local. Leaving a broken test step beside a real gate is how
# someone later trusts the wrong green check.
#
# The real gate is `bash scripts/gate.sh`, run from scripts/deploy.sh on the
# machine that can actually reach the models.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: anios_db
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: anios_db
      POSTGRES_HOST: localhost
      REDIS_HOST: localhost
      SECRET_KEY: "test-secret-key"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff black mypy

      - name: Run Ruff (Linting)
        run: ruff check .

      - name: Run Black (Formatting Check)
        run: black --check .

      - name: Run MyPy (Type Checking)
        run: mypy backend

